<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="description" content="ElectroBrain — Learn, Calculate, Experiment. CTVET-aligned electrical engineering learning for SHS, TVET and University 100–400.">
<meta name="theme-color" content="#050b14">
<meta name="color-scheme" content="dark light">
<title>ElectroBrain ⚡</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050b14;--panel:#07111e;--card:#0c1828;--card2:#102033;
  --border:#1d3149;--border2:#29405b;--text:#f4f8ff;--muted:#9db0c8;
  --blue:#37a8ff;--yellow:#ffd43b;--green:#45d483;--red:#ff6978;
  --radius:17px;--radius-sm:12px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="light"]{
  --bg:#f5f8fc;--panel:#ffffff;--card:#ffffff;--card2:#eef3f9;
  --border:#d8e1ec;--border2:#c3cfdd;--text:#0b1a2c;--muted:#5a6c82;
  --blue:#0d7fe0;--yellow:#b8860b;--green:#1e9e57;--red:#d32f4a;
  --shadow:0 6px 24px rgba(20,40,70,.10);
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;border-radius:10px;
}
a{color:var(--blue)}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:999;background:var(--blue);color:#04101d;padding:10px 14px;border-radius:10px;font-weight:900}
.skip-link:focus{left:8px}

.top{
  height:64px;position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top)
}
.logo{font-size:20px;font-weight:900;letter-spacing:.2px}
.logo span{color:var(--blue)}
.logo b{color:var(--yellow)}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;font-size:17px;
  border:1px solid var(--border2);background:var(--panel);color:var(--text);
  transition:border-color .15s
}
.icon-btn:hover{border-color:var(--blue)}

.page{position:fixed;top:64px;bottom:64px;left:0;right:0;display:none;background:var(--bg)}
.page.active{display:block}
.scroll{
  height:100%;overflow:auto;padding:20px 14px 100px;
  max-width:1000px;margin:auto;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
@media(prefers-reduced-motion:reduce){
  .scroll{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

nav{
  position:fixed;bottom:0;left:0;right:0;height:64px;z-index:100;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--panel);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  border:0;background:none;color:var(--muted);font-size:10px;
  padding:6px 2px;border-radius:10px;margin:4px;transition:color .15s
}
nav button.active{color:var(--blue)}
.navicon{display:block;font-size:19px;margin-bottom:3px}

h1{font-size:28px;margin:5px 0 7px;line-height:1.2}
h2{font-size:19px;margin-bottom:7px}
h3{font-size:16px}
p{color:var(--muted);font-size:13px;line-height:1.55}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--blue);font-weight:900;text-transform:uppercase}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.btn{border:0;border-radius:var(--radius-sm);padding:13px;background:var(--blue);color:#04101d;font-weight:900;transition:filter .15s var(--ease)}
.btn:hover{filter:brightness(1.08)}
.btn2{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px;background:var(--panel);color:var(--text);font-weight:800;transition:border-color .15s}
.btn2:hover{border-color:var(--blue)}

.search{width:100%;padding:13px 40px 13px 13px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--panel);color:var(--text);outline:none;transition:border-color .15s}
.search:focus{border-color:var(--blue)}
.search-wrap{position:relative}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:var(--card);color:var(--muted);display:none}
.search-wrap.has-value .search-clear{display:block}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--panel);border:1px solid var(--border);padding:5px;border-radius:14px;margin:14px 0}
.tabs button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font-weight:900;transition:background .15s,color .15s}
.tabs button.active{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--blue)}

.topic{padding:15px;border:1px solid var(--border);border-radius:15px;background:var(--card);cursor:pointer;transition:border-color .15s,transform .15s}
.topic:hover{border-color:var(--blue)}
.topic:active{transform:scale(.99)}
.topic .ico{font-size:23px;margin-bottom:9px}
.topic small{display:block;color:var(--muted);margin-top:5px;font-size:11px}

.back{border:0;background:none;color:var(--blue);font-weight:800;padding:8px 0;margin-bottom:8px;display:inline-flex;gap:6px;align-items:center}

.notice{padding:12px;border-radius:var(--radius-sm);background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.5;margin:12px 0}

.result{padding:17px;border-radius:16px;background:#071a18;border:1px solid #246149;margin-top:12px}
.result strong{color:var(--green);font-size:24px}

.formrow{margin:10px 0}
.formrow label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.formrow input,.formrow select{width:100%;padding:12px;border:1px solid var(--border2);border-radius:10px;background:var(--panel);color:var(--text)}
.formrow input:focus,.formrow select:focus{border-color:var(--blue)}

/* LESSON */
.lesson{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;line-height:1.65}
.lesson .diagram{margin:15px 0;padding:25px;text-align:center;border:1px dashed var(--border2);border-radius:14px;font-size:42px;background:var(--card2)}
.lesson .formula{margin:14px 0;padding:15px;text-align:center;background:var(--card2);border-radius:12px;color:var(--yellow);font-size:20px;font-weight:900;font-family:ui-monospace,monospace}
.lesson h3{margin-top:22px;margin-bottom:8px;color:var(--blue);font-size:15px;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
.lesson h3:first-child{margin-top:0}
.lesson ul,.lesson ol{padding-left:22px;color:var(--muted);font-size:13px}
.lesson li{margin:6px 0;line-height:1.55}
.lesson p{margin-bottom:10px}
.lesson-meta{display:flex;gap:12px;align-items:center;margin:6px 0 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.progress-dots{display:flex;gap:5px}
.progress-dots i{width:7px;height:7px;border-radius:50%;background:var(--border2);display:inline-block}
.progress-dots i.on{background:var(--blue)}
.readtime{display:inline-flex;gap:4px;align-items:center}
.answerbox{padding:13px;background:var(--card2);border-radius:12px;margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}
.objectives{background:var(--card2);border-left:3px solid var(--blue);padding:12px 14px;border-radius:10px;margin:12px 0}
.objectives ul{margin:0;padding-left:18px}
.objectives li{margin:4px 0}
.summary{background:var(--card2);border-left:3px solid var(--green);padding:12px 14px;border-radius:10px;margin:14px 0 0}
.lessonnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lessonnav button{padding:12px;border-radius:11px;border:1px solid var(--border2);background:var(--panel);color:var(--text)}

/* LABS */
.labhero{padding:18px;background:linear-gradient(135deg,var(--card2),var(--panel));border:1px solid var(--border);border-radius:18px}
.labsection{margin-top:12px;padding:15px;background:var(--card);border:1px solid var(--border);border-radius:16px}
.labsection h2{font-size:16px;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:900}
.procedure{counter-reset:step;padding:0;list-style:none;margin:0}
.procedure li{
  counter-increment:step;position:relative;padding:10px 10px 10px 44px;
  border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;color:var(--text)
}
.procedure li:last-child{border-bottom:0}
.procedure li::before{
  content:counter(step);position:absolute;left:6px;top:9px;
  width:26px;height:26px;border-radius:50%;
  background:var(--blue);color:#04101d;display:grid;place-items:center;
  font-weight:900;font-size:12px
}
.tools-list{display:flex;flex-wrap:wrap;gap:8px}
.tools-list span{padding:8px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;font-size:12px}
.equipment-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.equipment-list div{padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:10px;font-size:12px;display:flex;gap:8px;align-items:center}
.safety{background:#2a1a05;border:1px solid #6b4a12;color:#ffd43b;border-radius:12px;padding:12px;font-size:12px;line-height:1.55;margin-top:12px}
[data-theme="light"] .safety{background:#fff8e1;border-color:#e0b64a;color:#7a5410}
.wiring-diagram{
  background:var(--card2);border:1px solid var(--border2);border-radius:14px;
  padding:16px;margin-top:10px;overflow-x:auto
}
.wiring-diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}
.diagram-caption{text-align:center;color:var(--muted);font-size:11px;margin-top:8px;font-style:italic}

/* CALC */
.calc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.calc-answer{padding:16px;margin-top:12px;background:#071a18;border:1px solid #246149;border-radius:15px}
[data-theme="light"] .calc-answer{background:#f0faf4;border-color:#4ba776}
.calc-answer .big{font-size:27px;color:var(--green);font-weight:900;margin:5px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:ui-monospace,monospace}
.calc-answer .big .unit{font-size:14px;color:var(--muted);font-weight:700}
.formula-card{padding:15px;background:var(--card2);border-radius:13px;border:1px solid var(--border)}

/* HOME */
.homehero{padding:20px;border-radius:20px;background:linear-gradient(135deg,var(--card2),var(--panel));border:1px solid var(--border)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.quick button{padding:12px;border-radius:12px;border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:11px;transition:border-color .15s}
.quick button:hover{border-color:var(--blue)}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:8px}
.sectiontitle span{color:var(--muted);font-size:11px}

.progress-ring{position:relative;width:82px;height:82px;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:15px;font-weight:900;color:var(--blue)
}
.subject-progress{margin-top:8px;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.subject-progress i{display:block;height:100%;background:var(--yellow)}

.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border2);border-radius:14px}

#toasts{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92%,420px)}
.toast{padding:11px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--blue);color:var(--text);font-size:12px;font-weight:700;box-shadow:var(--shadow);animation:toast-in .22s var(--ease)}
.toast.warn{border-color:var(--yellow)}
.toast.err{border-color:var(--red)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

#modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
#modal-backdrop.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:20px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:80vh;overflow:auto}
.modal h2{margin-bottom:10px}
.modal .formrow{margin-top:12px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.modal-list{font-size:12px;color:var(--muted);line-height:1.7;padding-left:18px}

@media(max-width:600px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .equipment-list{grid-template-columns:1fr}
  .toolgrid{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:repeat(2,1fr)}
  .scroll{padding-left:12px;padding-right:12px}
  h1{font-size:24px}
}
@media print{
  nav, .top, .skip-link, .lessonnav, .calc-actions{display:none!important}
  .page{position:static;display:block!important}
  .scroll{height:auto;overflow:visible;padding:0;max-width:none}
  body{background:#fff;color:#000}
  .lesson, .card{background:#fff;border:1px solid #ccc;color:#000}
  .lesson h3{color:#000}
  p, li{color:#222}
}
</style>
</head>

<script>

/* =========================================================
   DATA
   ========================================================= */

const LEVELS=["SHS / TVET","University 100","University 200","University 300","University 400"];

const SUBJECTS={
"SHS / TVET":[
"Electrical Fundamentals","DC Circuits","AC Circuits",
"Electrical Installation & Protection","Measurement & Instrumentation",
"Electrical Machines","Transformers","Electronics",
"Digital Electronics","Technical Drawing","Renewable Energy",
"Engineering Mathematics","Basic Control Systems",
"Industrial Electricity","Electrical Calculations","Basic Electronics"
],
"University 100":[
"Engineering Mathematics I","Engineering Physics","Electrical Engineering Fundamentals",
"Circuit Theory I","Digital Logic Fundamentals","Engineering Drawing",
"Measurement Fundamentals","Computing for Engineers","Programming for Electrical Engineers",
"Electrical Workshop Practice","Introduction to Control Systems","Introduction to Power Systems",
"Engineering Materials"
],
"University 200":[
"Engineering Mathematics II","Circuit Theory II","AC Circuit Analysis",
"Electronics I","Electrical Machines I","Signals & Systems",
"Electromagnetics I","Measurements & Instrumentation","Power Systems Fundamentals",
"Control Systems I","Electromagnetic Fields","Electrical Installation Engineering",
"Electronic Devices","Engineering Probability & Statistics","Electrical Energy Systems"
],
"University 300":[
"Power Electronics","Electrical Machines II","Power Systems","Protection Systems",
"Control Systems II","PLC & Industrial Automation","Renewable Energy Systems",
"Electrical Drives","Advanced Electronics","Transmission & Distribution",
"Electromagnetics II","Power System Protection","Industrial Instrumentation",
"Embedded Systems","Engineering Economics"
],
"University 400":[
"Advanced Power Systems","High Voltage Engineering","Advanced Protection",
"Advanced Control","Power Electronics Applications","Renewable & Solar PV Systems",
"Electrical Drives","Industrial Automation","Engineering Project","Research Methods",
"Professional Practice","Smart Grids","Power System Stability",
"Advanced Instrumentation","Engineering Design","Entrepreneurship for Engineers"
]
};

/*
Textbook content — written as real class notes.
Each topic has: definition, why, objectives, intro, theory,
formula + symbols, worked example with method, applications,
common mistakes, summary, quick check.
*/

const TEXTBOOK={

"Voltage":{
definition:"Voltage (potential difference) is the electrical pressure that pushes charge from one point to another. Formally, it is the work done per unit charge in moving that charge between two points.",
why:"Without a voltage, charge has no reason to move. Every circuit you will ever build or troubleshoot relies on a voltage source — a battery, a generator, or the mains — to push current through conductors and loads.",
objectives:[
"State the definition of voltage and its SI unit.",
"Explain the difference between voltage and current.",
"Calculate voltage from work and charge using V = W/Q.",
"Identify a voltmeter's correct connection in a circuit."
],
intro:"Think of a water tank on a roof. The height of the water above the tap gives it pressure; open the tap and water flows. Voltage works the same way — it is the 'height' of electrical pressure between two points. No pressure, no flow.",
theory:"Charges of the same sign repel, opposite signs attract. When you separate them — say, chemically in a battery — you store energy. That stored energy, per unit of charge, is what we call voltage. The higher the voltage between two points, the more energy each coulomb carries, and the harder it can push through a resistance. A voltmeter measures this pressure difference, so it must be connected in parallel across the two points of interest — never in series, or it will block the current.",
formula:"V = W / Q",
symbols:"V = voltage in volts (V); W = work or energy transferred in joules (J); Q = charge in coulombs (C).",
example:{
problem:"A battery does 24 J of work moving 2 C of charge from its negative to its positive terminal. What is the battery's terminal voltage?",
steps:[
"Write the formula: V = W / Q.",
"Identify knowns: W = 24 J, Q = 2 C.",
"Substitute: V = 24 / 2.",
"Calculate: V = 12.",
"State the unit: V = 12 V."
]
},
applications:[
"Mains supply: 230 V single-phase, 400 V three-phase (Ghana).",
"Automotive battery: 12 V nominal.",
"USB supply: 5 V.",
"Transmission lines: 161 kV, 330 kV — high voltage to reduce current."
],
mistakes:[
"Connecting a voltmeter in series — it reads almost full source voltage and blocks the circuit.",
"Confusing voltage with current. Voltage is the cause; current is the effect.",
"Adding voltages across parallel branches instead of recognising they share the same voltage."
],
summary:[
"Voltage is work per unit charge, measured in volts.",
"It is a difference between two points, not a property of one point alone.",
"A voltmeter is connected in parallel.",
"The relationship V = W/Q links electrical energy to charge."
],
quickCheck:{q:"A 9 V battery moves 3 C of charge through a bulb. How much energy is transferred?",a:"W = V × Q = 9 × 3 = 27 J."}
},

"Current":{
definition:"Electric current is the rate at which electric charge flows past a point in a circuit. One ampere is one coulomb of charge passing a point per second.",
why:"Current is what actually does the work in a circuit — it heats the element, turns the motor, lights the LED. Sizing cables, choosing fuses and protecting people all depend on knowing how much current will flow.",
objectives:[
"Define electric current and state its SI unit.",
"Calculate current from charge and time.",
"Distinguish conventional current from electron flow.",
"Explain how an ammeter is connected."
],
intro:"Picture water flowing through a pipe. The number of litres crossing a point every second is the flow rate. Current is exactly that, but for electrons in a wire: how many coulombs cross a point every second.",
theory:"Inside a conductor, free electrons drift when a voltage is applied. We conventionally draw current as flowing from positive to negative (the direction positive charge would move), even though electrons actually drift the other way. This convention is historical — Franklin guessed the sign wrong — but it is universal in engineering, so we stick with it. An ammeter measures current, so it must be connected in series with the circuit — placing it in parallel would short the supply.",
formula:"I = Q / t",
symbols:"I = current in amperes (A); Q = charge in coulombs (C); t = time in seconds (s).",
example:{
problem:"In 4 seconds, 20 coulombs of charge flow past a point in a wire. What is the current?",
steps:[
"Formula: I = Q / t.",
"Knowns: Q = 20 C, t = 4 s.",
"Substitute: I = 20 / 4.",
"Calculate: I = 5.",
"Unit: I = 5 A."
]
},
applications:[
"Household socket outlets rated 13 A or 16 A.",
"LED indicator draws 10–20 mA.",
"Electric kettle draws about 10 A at 230 V.",
"Motor starters limit inrush current to protect windings."
],
mistakes:[
"Connecting an ammeter in parallel — it becomes a short circuit and blows its fuse.",
"Confusing current with voltage.",
"Assuming current is 'used up' in a circuit. It is not: current leaving a load equals current entering it."
],
summary:[
"Current is the rate of charge flow, measured in amperes.",
"Conventional current flows positive → negative externally.",
"An ammeter is connected in series.",
"Current is the same at every point in a series circuit."
],
quickCheck:{q:"A current of 2 A flows for 30 s. How much charge has passed?",a:"Q = I × t = 2 × 30 = 60 C."}
},

"Resistance":{
definition:"Resistance is the opposition a material offers to the flow of electric current. It converts electrical energy into heat as charge passes through.",
why:"Every real circuit has resistance. Whether you're choosing a resistor to limit LED current, sizing a heating element, or calculating voltage drop on a long cable run, resistance is the controlling quantity.",
objectives:[
"Define resistance and state its SI unit.",
"Calculate resistance from voltage and current.",
"List the four factors that affect the resistance of a conductor.",
"Explain why resistors dissipate heat."
],
intro:"Push the same current through a thin wire and a thick wire. The thin wire gets hotter — it 'fights' the current more. That opposition is resistance, and it is not a defect: resistors are how we deliberately control current.",
theory:"Inside a metal, electrons collide with the atomic lattice as they drift. Every collision converts kinetic energy into heat. The resistance R of a uniform conductor depends on four things: the material (resistivity ρ), its length L, its cross-sectional area A, and its temperature. Longer wire = more resistance; thicker wire = less resistance. The relationship is R = ρL/A. For a given conductor, resistance is defined by Ohm's Law as R = V/I.",
formula:"R = V / I",
symbols:"R = resistance in ohms (Ω); V = voltage in volts (V); I = current in amperes (A). Also R = ρL/A where ρ = resistivity (Ω·m), L = length (m), A = area (m²).",
example:{
problem:"A resistor has 12 V across it when 3 A flows. What is its resistance?",
steps:[
"Formula: R = V / I.",
"Knowns: V = 12 V, I = 3 A.",
"Substitute: R = 12 / 3.",
"Calculate: R = 4.",
"Unit: R = 4 Ω."
]
},
applications:[
"Current-limiting resistor in series with an LED.",
"Voltage divider to sense battery voltage.",
"Heating element in a kettle or iron (deliberately high resistance).",
"Shunt resistor for measuring current."
],
mistakes:[
"Confusing resistance with resistivity — resistivity is a material property, resistance depends on geometry.",
"Assuming a resistor is always a 'bad' thing — it is often the control you want.",
"Forgetting that resistance rises with temperature in metals (positive temperature coefficient)."
],
summary:[
"Resistance is opposition to current, measured in ohms.",
"R = V/I defines resistance for a component.",
"Conductor resistance depends on material, length, area, and temperature.",
"Resistors convert electrical energy into heat."
],
quickCheck:{q:"A 6 Ω resistor carries 2 A. What voltage is across it?",a:"V = I × R = 2 × 6 = 12 V."}
},

"Power":{
definition:"Electrical power is the rate at which electrical energy is transferred, converted, or dissipated. It tells you how fast a load is consuming (or delivering) energy.",
why:"Power ratings decide what fuse to use, what cable to run, what size motor to order, and what your electricity bill will be. Every appliance you buy has a power rating — and that rating is what the installation must handle.",
objectives:[
"State the three power formulas and when to use each.",
"Calculate electrical power from voltage and current.",
"Calculate energy consumption in kilowatt-hours.",
"Explain why power factor matters in AC circuits."
],
intro:"Two kettles, same voltage, one takes 2 A, one takes 10 A. They will heat water at different rates — the 10 A kettle is doing more work per second. Power measures exactly that: how much energy is converted each second.",
theory:"Power is the product of voltage and current for a DC circuit (P = VI). It can also be written P = I²R or P = V²/R, which are useful when you know the current or voltage but not both. In AC circuits with reactive loads, the useful (real) power is P = VIcosφ where cosφ is the power factor. The product V × I in AC is apparent power (VA), not the real watts actually delivered to the load. That distinction is why power factor correction saves industrial customers money.",
formula:"P = VI      P = I²R      P = V²/R      P = VIcosφ (AC)",
symbols:"P = power in watts (W); V = voltage (V); I = current (A); R = resistance (Ω); cosφ = power factor.",
example:{
problem:"A kettle connected to 230 V draws 10 A. What is its power rating?",
steps:[
"Formula (DC or resistive AC): P = VI.",
"Knowns: V = 230 V, I = 10 A.",
"Substitute: P = 230 × 10.",
"Calculate: P = 2300.",
"Unit: P = 2300 W = 2.3 kW."
]
},
applications:[
"Appliance ratings on nameplates.",
"Fuse sizing — fuse must be > appliance current but < cable rating.",
"Electricity billing (kWh = kW × hours).",
"Motor selection for a mechanical load."
],
mistakes:[
"Using P = VI on an AC inductive motor and assuming the answer is real power (it is apparent power — multiply by power factor).",
"Confusing kW (real power) with kVA (apparent power).",
"Forgetting that motors have a start current much higher than their running current."
],
summary:[
"Power is the rate of energy transfer, measured in watts.",
"P = VI works for DC and resistive AC.",
"For AC with reactive loads, use P = VIcosφ.",
"Energy = Power × Time (kWh for billing)."
],
quickCheck:{q:"A 500 W heater runs for 4 hours. How many kWh does it consume?",a:"Energy = 0.5 kW × 4 h = 2 kWh."}
},

"Ohm's Law":{
definition:"Ohm's Law states that the current through an ohmic conductor is directly proportional to the voltage across it, provided temperature and other physical conditions remain constant.",
why:"It is the single most-used relationship in electrical work. From picking a resistor for an LED to diagnosing why a socket outlet reads low voltage under load, Ohm's Law is where every calculation starts.",
objectives:[
"State Ohm's Law and its three rearranged forms.",
"Apply Ohm's Law to find V, I, or R.",
"Explain the meaning of 'ohmic' and identify non-ohmic components.",
"Check whether a resistor is within tolerance using measured values."
],
intro:"Ohm discovered something beautifully simple: push twice as hard (double V), twice as much flows (double I). That constant ratio is resistance. This one rule unlocks almost everything else in the course.",
theory:"Ohm's Law applies strictly to 'ohmic' materials — metals at constant temperature. A lamp filament and a diode are non-ohmic: their resistance changes with temperature or polarity. That doesn't mean Ohm's Law is wrong; it means you use the measured V and I at each instant. In every practical circuit you meet, applying Ohm's Law correctly means identifying which quantity is fixed (usually R) and which two you know.",
formula:"V = I × R      I = V / R      R = V / I",
symbols:"V = voltage (V); I = current (A); R = resistance (Ω).",
example:{
problem:"A 4 Ω resistor is connected across a 12 V supply. What current flows?",
steps:[
"Formula: I = V / R.",
"Knowns: V = 12 V, R = 4 Ω.",
"Substitute: I = 12 / 4.",
"Calculate: I = 3.",
"Unit: I = 3 A."
]
},
applications:[
"Finding unknown resistors from measured V and I.",
"Predicting current draw of a load before connecting it.",
"Checking a heater's expected resistance.",
"Choosing current-limiting resistors for LEDs (R = (Vs - Vled) / I)."
],
mistakes:[
"Using Ohm's Law on a diode or lamp at high temperature and being surprised the values drift.",
"Forgetting unit conversions (mA → A, kΩ → Ω).",
"Mixing up which quantity to leave as the unknown in a series/parallel network."
],
summary:[
"V = IR holds for ohmic conductors at constant temperature.",
"Three forms cover all three unknowns.",
"Non-ohmic components need measured values at the operating point.",
"Always use consistent units."
],
quickCheck:{q:"A 12 V source across a 3 Ω resistor. What current flows?",a:"I = V/R = 12/3 = 4 A."}
},

"Series Circuits":{
definition:"A series circuit has exactly one path for current. All components are connected end-to-end so the same current flows through each in turn.",
why:"Series connections appear in fuses (in series with the load), switch drops, thermistors, and LED strings. Understanding them prevents the classic mistake of adding currents instead of voltages.",
objectives:[
"State the two rules for series circuits (current and voltage).",
"Calculate total resistance of resistors in series.",
"Apply the voltage divider principle.",
"Recognise when a series connection is inappropriate."
],
intro:"Old-fashioned fairy lights were wired in series — one bulb burns out, the whole string goes dark. That is the defining feature: one break stops everything. The same current flows through each bulb, and the supply voltage is shared among them.",
theory:"In a series circuit, current is the same at every point (no branch for charge to take), and the total voltage is the sum of the individual voltage drops (KVL). Resistance adds directly: Rtotal = R1 + R2 + R3 + … This means the biggest resistor drops the biggest voltage — that's the voltage divider principle, and it's how we sense things like a battery's charge level.",
formula:"I total = I1 = I2 = I3      V total = V1 + V2 + V3      R total = R1 + R2 + R3",
symbols:"I = current (A); V = voltage (V); R = resistance (Ω).",
example:{
problem:"Three resistors 4 Ω, 6 Ω, 10 Ω are in series across a 20 V supply. Find total resistance, current, and voltage across each.",
steps:[
"Rtotal = 4 + 6 + 10 = 20 Ω.",
"I = V / Rtotal = 20 / 20 = 1 A.",
"V1 = I × R1 = 1 × 4 = 4 V.",
"V2 = I × R2 = 1 × 6 = 6 V.",
"V3 = I × R3 = 1 × 10 = 10 V.",
"Check: 4 + 6 + 10 = 20 V ✓."
]
},
applications:[
"Fuses and MCBs are in series with the load they protect.",
"LED strings with a current-limiting resistor.",
"Voltage dividers for sensing.",
"Switch drop in a control circuit."
],
mistakes:[
"Adding currents in a series circuit.",
"Forgetting that removing any one component breaks the entire circuit.",
"Choosing a resistor whose power rating is too low — P = I²R can cook it."
],
summary:[
"Same current everywhere.",
"Voltages add to the supply voltage.",
"Resistances add directly.",
"Voltage divider: Vn = V × Rn / Rtotal."
],
quickCheck:{q:"Two resistors, 3 Ω and 5 Ω, in series across 16 V. What is the current?",a:"Rtotal = 8 Ω; I = 16/8 = 2 A."}
},

"Parallel Circuits":{
definition:"A parallel circuit has more than one path for current. Components are connected across the same two nodes, so they share the same voltage but carry different currents.",
why:"Every socket outlet in your house is in parallel — that's why turning on one light doesn't affect the others, and why each appliance receives the full 230 V.",
objectives:[
"State the two rules for parallel circuits.",
"Calculate total resistance of parallel resistors.",
"Apply the current divider principle.",
"Explain why houses are wired in parallel, not series."
],
intro:"Your home is wired in parallel: each light and socket gets the full mains voltage and can be switched independently. Pull out a bulb and the rest keep working — that's the definition of parallel behaviour. The trade-off: total resistance falls as you add more branches.",
theory:"In parallel, each branch connects to the same two nodes, so voltage is identical across all branches. Current splits among the branches according to conductance (inversely with resistance): bigger branch, more current. Total resistance always comes out lower than the smallest branch, because adding paths makes it easier for current to flow. The reciprocal rule handles two or more: 1/Rtotal = 1/R1 + 1/R2 + … For just two: Rtotal = (R1 × R2) / (R1 + R2).",
formula:"V total = V1 = V2 = V3      I total = I1 + I2 + I3      1/Rtotal = 1/R1 + 1/R2 + 1/R3",
symbols:"V = voltage (V); I = current (A); R = resistance (Ω).",
example:{
problem:"Two resistors, 6 Ω and 3 Ω, are connected in parallel across a 12 V supply. Find total resistance and the current in each branch.",
steps:[
"V across each branch = 12 V (parallel rule).",
"I1 = V / R1 = 12 / 6 = 2 A.",
"I2 = V / R2 = 12 / 3 = 4 A.",
"Itotal = 2 + 4 = 6 A.",
"Rtotal = V / Itotal = 12 / 6 = 2 Ω.",
"Check with product/sum: (6 × 3)/(6 + 3) = 18/9 = 2 Ω ✓."
]
},
applications:[
"Domestic socket ring or radial circuits (parallel by nature).",
"Battery banks (parallel increases capacity).",
"Lighting circuits.",
"Current shunts."
],
mistakes:[
"Adding resistances in parallel as if they were in series (the total must be *smaller* than the smallest branch).",
"Adding voltages in a parallel circuit — they are equal, not summed.",
"Forgetting that parallel loads draw more total current, which may exceed supply capacity."
],
summary:[
"Same voltage across every branch.",
"Currents add to give total current.",
"1/Rtotal = sum of reciprocals.",
"Parallel is the standard way to wire building loads."
],
quickCheck:{q:"Two 10 Ω resistors in parallel. What is Rtotal?",a:"Rtotal = (10×10)/(10+10) = 100/20 = 5 Ω."}
},

"AC Voltage":{
definition:"An alternating voltage periodically reverses polarity, typically following a sinusoidal waveform. In Ghana and most of the world it completes 50 cycles every second.",
why:"The mains supply everywhere is AC, because AC is easy to transform up for transmission and down for domestic use. Motors, transformers, and household appliances all rely on AC behaviour.",
objectives:[
"Describe a sinusoidal AC waveform.",
"State the difference between peak and RMS values.",
"Convert between peak, RMS and peak-to-peak.",
"Explain what '50 Hz' means."
],
intro:"Plug an oscilloscope into a wall socket and you see a smooth wave rising and falling 50 times a second — not a flat line. That wave is AC. Its average value over a full cycle is zero, but it still delivers energy; the meaningful value engineers use is the RMS value, 230 V for our mains.",
theory:"A sinusoidal voltage v(t) = Vp·sin(2πft) has peak value Vp, frequency f (Hz), and period T = 1/f. The RMS (root-mean-square) value is Vp/√2 ≈ 0.707·Vp, and it is the value that a voltmeter displays and that produces the same heating as a DC voltage of that magnitude. So '230 V AC' actually peaks at about 325 V — the insulation and components must handle that peak.",
formula:"Vrms = Vp / √2 ≈ 0.707 × Vp      Vp = √2 × Vrms ≈ 1.414 × Vrms      f = 1 / T",
symbols:"Vrms = RMS voltage (V); Vp = peak voltage (V); f = frequency (Hz); T = period (s).",
example:{
problem:"The RMS voltage of the mains supply is 230 V. What is its peak voltage?",
steps:[
"Formula: Vp = √2 × Vrms.",
"Substitute: Vp = 1.414 × 230.",
"Calculate: Vp ≈ 325 V."
]
},
applications:[
"Designing insulation for the peak (325 V), not the RMS (230 V).",
"Selecting capacitors rated above 400 V for mains filtering.",
"Understanding why AC motors need special starting arrangements.",
"Transformer design driven by RMS voltage and frequency."
],
mistakes:[
"Using Vrms in a formula that actually needs Vp (e.g. peak insulation stress).",
"Confusing frequency with angular frequency (ω = 2πf).",
"Assuming '50 Hz' means 50 V."
],
summary:[
"AC is sinusoidal, 50 Hz in Ghana.",
"Vrms = 0.707 × Vp.",
"Vpeak = 1.414 × Vrms.",
"Meters display RMS values."
],
quickCheck:{q:"A transformer secondary has a peak of 40 V. What is its RMS value?",a:"Vrms = 40 / 1.414 ≈ 28.3 V."}
},

"Impedance":{
definition:"Impedance is the total opposition a circuit presents to AC current, combining resistance and reactance in a single complex quantity Z.",
why:"Without impedance you cannot correctly calculate AC current. Motors, transformers, and cables all have impedance, and it is frequency-dependent — which is why a motor behaves differently at start-up versus running speed.",
objectives:[
"Define impedance and distinguish it from resistance.",
"Calculate impedance from R and X using the magnitude formula.",
"Explain why impedance is frequency-dependent.",
"State the relationship between V, I, and Z."
],
intro:"In DC, only resistance matters. In AC, capacitors and inductors also oppose current — but not the same way, and not by the same amount at every frequency. Impedance is the umbrella term that captures both kinds of opposition.",
theory:"Impedance is a complex number: Z = R + jX, where R is resistance and X is reactance (positive for inductors, negative for capacitors). Its magnitude |Z| = √(R² + X²) is what determines V/I. Reactance itself depends on frequency: XL = 2πfL for an inductor, XC = 1/(2πfC) for a capacitor. So at 50 Hz a motor's impedance is very different from what it is during the high-frequency transient of starting — which is why starting current is much higher than running current.",
formula:"Z = √(R² + X²)      XL = 2πfL      XC = 1/(2πfC)",
symbols:"Z = impedance magnitude (Ω); R = resistance (Ω); X = reactance (Ω); XL = inductive reactance; XC = capacitive reactance; f = frequency (Hz); L = inductance (H); C = capacitance (F).",
example:{
problem:"A coil has R = 6 Ω and reactance X = 8 Ω. Find its impedance magnitude.",
steps:[
"Formula: Z = √(R² + X²).",
"Substitute: Z = √(6² + 8²).",
"Square: Z = √(36 + 64).",
"Sum: Z = √100.",
"Result: Z = 10 Ω."
]
},
applications:[
"AC circuit analysis with motors and transformers.",
"Impedance matching in audio and RF circuits.",
"Filter design (RC, RL).",
"Cable impedance calculations for long runs."
],
mistakes:[
"Adding R and X directly as if both were resistances (impedance is a vector sum, not a scalar).",
"Ignoring frequency dependence.",
"Using DC Ohm's Law (I = V/R) for AC and getting the current wrong."
],
summary:[
"Impedance Z combines R and X.",
"|Z| = √(R² + X²).",
"Reactance depends on frequency.",
"V = I × Z in AC."
],
quickCheck:{q:"A circuit has R = 3 Ω and X = 4 Ω. What is Z?",a:"Z = √(9 + 16) = √25 = 5 Ω."}
},

"Power Factor":{
definition:"Power factor is the ratio of real power (watts) to apparent power (volt-amperes) in an AC circuit: PF = P / S = cosφ.",
why:"Utilities charge industrial customers for poor power factor because it wastes capacity. Motors, transformers, and fluorescent lamps all have lagging power factor, and correcting it saves money and reduces current in cables.",
objectives:[
"Define real, apparent, and reactive power.",
"State the power factor formula.",
"Explain why motors have lagging power factor.",
"Describe how capacitor banks correct power factor."
],
intro:"A 100 W motor might draw 150 VA from the supply. The extra 50 VA doesn't do useful work — it sloshes back and forth between the supply and the motor's magnetic field. Power factor measures how much of the apparent power is actually doing work.",
theory:"In an AC circuit with reactive (inductive or capacitive) elements, the current is not in phase with the voltage. Real power P = VIcosφ; apparent power S = VI; reactive power Q = VIsinφ. The three form a power triangle: S² = P² + Q². A power factor of 1 (unity) is ideal — pure resistance. Industrial motors have PF around 0.7–0.85, so engineers install capacitor banks (which supply reactive power locally) to bring it closer to 1, reducing the current drawn from the utility.",
formula:"PF = cosφ = P / S      P = VIcosφ      S = VI      Q = VIsinφ      S² = P² + Q²",
symbols:"PF = power factor (0–1); P = real power (W); S = apparent power (VA); Q = reactive power (VAR); φ = phase angle between voltage and current.",
example:{
problem:"A load draws 5 kW of real power and 6.25 kVA of apparent power. What is its power factor?",
steps:[
"Formula: PF = P / S.",
"Convert: P = 5000 W, S = 6250 VA.",
"Substitute: PF = 5000 / 6250.",
"Result: PF = 0.8."
]
},
applications:[
"Utility billing (kVA demand charges).",
"Motor starting and running analysis.",
"Transformer sizing (rated in kVA, not kW).",
"Capacitor bank installation in factories."
],
mistakes:[
"Thinking a motor's nameplate kW equals the kVA it draws.",
"Confusing leading and lagging PF — inductive loads (motors) lag, capacitive loads lead.",
"Adding capacitors without checking resonance with the supply transformer."
],
summary:[
"PF = cosφ = P / S.",
"Ideal PF is 1 (resistive).",
"Inductive loads have lagging PF.",
"Correct with capacitors to reduce utility costs."
],
quickCheck:{q:"A load has PF = 0.9 and S = 10 kVA. What is P?",a:"P = PF × S = 0.9 × 10 = 9 kW."}
},

"Transformers":{
definition:"A transformer is a static device that transfers electrical energy between two circuits through electromagnetic induction, changing voltage levels in the process.",
why:"Without transformers, we couldn't transmit power over long distances at high voltage and then safely distribute it at 230 V. Every socket in your home is fed, somewhere upstream, by a transformer.",
objectives:[
"Explain the principle of electromagnetic induction as it applies to transformers.",
"State the turns ratio relationship.",
"Calculate secondary voltage given primary voltage and turns.",
"Distinguish step-up from step-down transformers."
],
intro:"Between the power station and your socket there are at least three transformers stepping voltage down in stages: transmission at hundreds of kilovolts, sub-transmission at tens of kilovolts, distribution at 11 kV or 33 kV, and finally 230/400 V for your home. All of it relies on a magnetic core and two coils.",
theory:"An alternating current in the primary winding creates a changing magnetic flux in the iron core. That flux links the secondary winding and, by Faraday's law, induces an alternating EMF in it. Because both windings see the same flux per turn, the voltage per turn is the same in both — hence the turns ratio: Vp / Vs = Np / Ns. If Ns > Np, the transformer is step-up; if Ns < Np, step-down. Real transformers lose a few percent to copper and core losses, but for calculations we treat them as ideal unless told otherwise. Note carefully: a transformer *does not* work on DC, because DC produces a steady flux that induces no EMF.",
formula:"Vp / Vs = Np / Ns      also      Vp × Ip ≈ Vs × Is (ideal power balance)",
symbols:"Vp = primary voltage (V); Vs = secondary voltage (V); Np = primary turns; Ns = secondary turns; Ip, Is = primary and secondary currents (A).",
example:{
problem:"A transformer has 1000 primary turns and 100 secondary turns. The primary is connected to 240 V. Find the secondary voltage.",
steps:[
"Formula: Vs = Vp × (Ns / Np).",
"Substitute: Vs = 240 × (100 / 1000).",
"Simplify the ratio: 100/1000 = 0.1.",
"Calculate: Vs = 240 × 0.1.",
"Result: Vs = 24 V. This is a step-down transformer."
]
},
applications:[
"Distribution: 11 kV → 230/400 V for buildings.",
"Isolation transformers in medical and lab settings.",
"Welding transformers.",
"Chargers (small step-down transformers)."
],
mistakes:[
"Assuming a transformer works on DC — it does not.",
"Mixing up primary and secondary turns in the ratio.",
"Forgetting that only the AC portion of a supply induces voltage — DC offset does nothing."
],
summary:[
"Uses electromagnetic induction; requires AC.",
"Vp/Vs = Np/Ns.",
"Np > Ns = step-down; Np < Ns = step-up.",
"Real transformers have ~2–5% losses."
],
quickCheck:{q:"A transformer has Np = 500, Ns = 50. Primary = 230 V. What is the secondary?",a:"Vs = 230 × (50/500) = 23 V."}
},

"Induction Motors":{
definition:"An induction motor is an AC motor in which the stator's rotating magnetic field induces current in the rotor, producing torque without any electrical connection to the rotor.",
why:"Roughly 80% of industrial motors are induction motors — pumps, fans, conveyors, compressors. They are robust, cheap, and need almost no maintenance.",
objectives:[
"Describe the construction of a squirrel-cage induction motor.",
"Explain how the rotating magnetic field induces rotor current.",
"Calculate synchronous speed from frequency and pole count.",
"Calculate slip."
],
intro:"Connect a three-phase induction motor and it just runs — no brushes, no commutator, no external DC. The rotor is a cage of copper or aluminium bars, shorted at both ends, with no wires leaving the motor. The magic is entirely magnetic.",
theory:"Three-phase stator windings, energised 120° apart in phase, create a magnetic field that rotates at synchronous speed Ns = 120f/P (where P is poles per phase and f is supply frequency). The rotor bars sit inside this rotating field. Because the field is moving, the rotor bars see a changing flux, so currents are induced in them. Those currents interact with the field to produce torque in the direction of rotation. The rotor can never quite reach synchronous speed — if it did, no relative motion, no induced current, no torque. The difference between synchronous speed and rotor speed is called slip: s = (Ns − Nr) / Ns.",
formula:"Ns = 120f / P      slip s = (Ns − Nr) / Ns      Nr = Ns(1 − s)",
symbols:"Ns = synchronous speed (rpm); f = supply frequency (Hz); P = number of poles; Nr = rotor speed (rpm); s = slip (typically 0.02–0.06 at full load).",
example:{
problem:"A 4-pole induction motor runs from a 50 Hz supply. What is its synchronous speed and, if slip is 4%, its actual rotor speed?",
steps:[
"Formula: Ns = 120f / P.",
"Substitute: Ns = 120 × 50 / 4.",
"Calculate: Ns = 6000 / 4 = 1500 rpm.",
"Slip formula: Nr = Ns(1 − s).",
"Substitute: Nr = 1500 × (1 − 0.04).",
"Calculate: Nr = 1500 × 0.96 = 1440 rpm."
]
},
applications:[
"Pumps and fans in water systems.",
"Conveyor belts in factories.",
"Air compressors.",
"HVAC systems."
],
mistakes:[
"Assuming rotor speed = synchronous speed (it never is at load).",
"Confusing pole count (per phase) with total poles.",
"Forgetting that a motor rated at 50 Hz running on 60 Hz will spin 20% faster and possibly overheat."
],
summary:[
"Induction motors need no electrical connection to the rotor.",
"Ns = 120f/P.",
"Slip is typically 2–6% at full load.",
"Reversing any two supply phases reverses direction."
],
quickCheck:{q:"A 2-pole motor on a 50 Hz supply. What is Ns?",a:"Ns = 120 × 50 / 2 = 3000 rpm."}
},

"DC Motors":{
definition:"A DC motor is a rotating electrical machine that converts direct-current electrical energy into mechanical energy using a magnetic field and a commutator.",
why:"DC motors offer excellent speed control and high starting torque, which is why they dominate in traction (older trains), robotics, and anywhere smooth speed control is essential.",
objectives:[
"Describe the construction of a DC motor.",
"State the back-EMF equation.",
"Explain why a DC motor draws a large current at start-up.",
"Calculate back-EMF from supply voltage and armature drop."
],
intro:"Connect a DC motor to a battery and it spins. Try to stop it by hand and it pushes back — and if you stall it completely, the current spikes dramatically. Understanding why is the key to safe motor control.",
theory:"The armature (rotor) sits in a magnetic field created by the field winding or permanent magnets. Current in the armature interacts with the field to produce torque. As the armature rotates, it also acts as a generator — it induces a back-EMF Eb that opposes the supply. The net voltage driving armature current is V − Eb, so Ia = (V − Eb) / Ra. At start-up, Eb = 0, so the only thing limiting current is Ra, which is small — hence the very high starting current. This is why DC motors always need a starter or current limit. Back-EMF depends on flux and speed: Eb = k·φ·ω.",
formula:"Eb = V − Ia·Ra      Ia = (V − Eb) / Ra      T = k·φ·Ia",
symbols:"Eb = back-EMF (V); V = supply voltage (V); Ia = armature current (A); Ra = armature resistance (Ω); T = torque (N·m); k = machine constant; φ = flux (Wb); ω = angular speed (rad/s).",
example:{
problem:"A 220 V DC shunt motor has armature resistance 0.5 Ω. At full load it draws 20 A. Calculate back-EMF.",
steps:[
"Formula: Eb = V − Ia·Ra.",
"Substitute: Eb = 220 − (20 × 0.5).",
"Calculate: Eb = 220 − 10.",
"Result: Eb = 210 V."
]
},
applications:[
"Traction motors on older trains.",
"Robotics and CNC machines.",
"Electric vehicles (with modern controllers).",
"Windshield wipers and starter motors in cars."
],
mistakes:[
"Connecting a DC motor directly to a large supply without current limiting — start-up current can be 5–10× rated.",
"Confusing shunt, series, and compound motor characteristics.",
"Forgetting that Eb drops when load increases, so speed drops slightly at load."
],
summary:[
"Back-EMF opposes the supply and limits running current.",
"At start, Eb = 0, so starting current is very high.",
"Speed control by varying V or flux.",

   ========================================================= */

const CHAPTER_NAMES=["Introduction & Fundamentals","Principles & Components","Analysis & Calculations","Applications & Troubleshooting"];

function topicFor(subject,i){
  const special={
    "Electrical Fundamentals":["Voltage","Current","Resistance","Power"],
    "DC Circuits":["Ohm's Law","Series Circuits","Parallel Circuits","Power Factor"],
    "AC Circuits":["AC Voltage","Impedance","Power Factor","Transformers"],
    "Electrical Machines":["Induction Motors","DC Motors","Motor Control","Motor Applications"],
    "Transformers":["Transformers","Turns Ratio","Transformer Losses","Applications"],
    "Digital Electronics":["Number Systems","Logic Gates","Boolean Logic","Digital Circuits"],
    "Measurement & Instrumentation":["Measurement Principles","Multimeter","Current Measurement","Voltage Measurement"],
    "PLC Fundamentals":["PLC Fundamentals","Inputs & Outputs","PLC Programming","PLC Applications"],
    "Variable Frequency Drives":["VFD Components","Frequency Control","Motor Control","VFD Applications"],
    "Solar PV Systems":["Solar PV Systems","PV Connections","System Design","Applications"],
    "Renewable Energy":["Solar PV Systems","PV Connections","System Design","Applications"]
  };
  return special[subject]?.[i]||CHAPTER_NAMES[i];
}

const CURRICULUM={};
Object.keys(SUBJECTS).forEach(level=>{
  CURRICULUM[level]=SUBJECTS[level].map(subject=>({
    subject,
    chapters:CHAPTER_NAMES.map((chapter,i)=>({
      chapter,
      topic:topicFor(subject,i),
      subs:[
        "Definition & Introduction",
        "Theory & Principles",
        "Calculations & Worked Example",
        "Applications & Summary"
      ]
    }))
  }));
});

const KEY="electrobrainData";
const LEARN_KEY="electrobrainLearn";
const PREF_KEY="electrobrainPrefs";
const THEME_KEY="electrobrainTheme";
const WELCOME_KEY="electrobrainWelcomed";
const RECENT_KEY="electrobrainRecent";

function defaultData(){
  return {
    name:"Engineer",
    level:"SHS / TVET",
    xp:0, correct:0, attempts:0, practice:0, labs:0, calculations:0,
    learned:[], bookmarks:[], activity:[], streak:0, lastVisit:null
  };
}

let data=defaultData();
try{
  const raw=localStorage.getItem(KEY);
  const saved=raw?JSON.parse(raw):null;
  if(saved&&typeof saved==="object"){
    data={...data,...saved};
    if(!Array.isArray(data.learned)) data.learned=[];
    if(!Array.isArray(data.bookmarks)) data.bookmarks=[];
    if(!Array.isArray(data.activity)) data.activity=[];
    if(!LEVELS.includes(data.level)) data.level="SHS / TVET";
    if(typeof data.name!=="string"||!data.name.trim()) data.name="Engineer";
  }
}catch(e){}

(function updateStreak(){
  const now=Date.now();
  const last=data.lastVisit||0;
  const dayMs=86400000;
  if(last){
    const diff=now-last;
    if(diff>dayMs*1.5){ data.streak=1; }
    else if(diff>dayMs*0.5){ data.streak=(data.streak||0)+1; }
  }else{ data.streak=1; }
  data.lastVisit=now;
})();

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }

let learnState={level:null,subject:null,chapter:null,sub:null};
try{
  const raw=localStorage.getItem(LEARN_KEY);
  const saved=raw?JSON.parse(raw):null;
  if(saved&&typeof saved==="object"){
    learnState={...learnState,...saved};
    if(learnState.level&&!CURRICULUM[learnState.level]){
      learnState={level:null,subject:null,chapter:null,sub:null};
    }
  }
}catch(e){}
function saveLearnState(){ try{ localStorage.setItem(LEARN_KEY,JSON.stringify(learnState)); }catch(e){} }

let prefs={labModeState:"Domestic",practiceModeState:"Theory"};
try{
  const raw=localStorage.getItem(PREF_KEY);
  const saved=raw?JSON.parse(raw):null;
  if(saved&&typeof saved==="object"){
    if(saved.labModeState==="Domestic"||saved.labModeState==="Industrial") prefs.labModeState=saved.labModeState;
    if(saved.practiceModeState==="Theory"||saved.practiceModeState==="Practical") prefs.practiceModeState=saved.practiceModeState;
  }
}catch(e){}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify(prefs)); }catch(e){} }

let labModeState=prefs.labModeState;
let practiceModeState=prefs.practiceModeState;

/* Theme */
let currentTheme="dark";
try{ currentTheme=localStorage.getItem(THEME_KEY)||"dark"; }catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",currentTheme);
  const btn=document.getElementById("themeBtn");
  if(btn) btn.textContent=currentTheme==="dark"?"☀":"☾";
}
function toggleTheme(){
  currentTheme=currentTheme==="dark"?"light":"dark";
  try{ localStorage.setItem(THEME_KEY,currentTheme); }catch(e){}
  applyTheme();
}

/* Recently viewed */
function getRecent(){
  try{ const raw=localStorage.getItem(RECENT_KEY); return raw?JSON.parse(raw)||[]:[]; }catch(e){ return []; }
}
function pushRecent(entry){
  try{
    const r=getRecent().filter(x=>x.id!==entry.id);
    r.unshift(entry);
    localStorage.setItem(RECENT_KEY,JSON.stringify(r.slice(0,5)));
  }catch(e){}
}

/* =========================================================
   HELPERS
   ========================================================= */

function esc(x){
  return String(x==null?"":x)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fmt(n,decimals){
  if(!Number.isFinite(n)) return "—";
  const d=decimals==null?6:decimals;
  return String(Number(n.toFixed(d)));
}
function logActivity(type,title){
  const clean=String(title||"").split("|").pop().slice(0,80);
  data.activity.unshift({type,title:clean,time:Date.now()});
  data.activity=data.activity.slice(0,40);
  save();
}
function toast(msg,kind){
  const wrap=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast"+(kind?" "+kind:"");
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.remove(),250); },2400);
}
function openModal({title,bodyHtml,actions}){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=bodyHtml;
  const acts=document.getElementById("modal-actions");
  acts.innerHTML="";
  actions.forEach(a=>{
    const b=document.createElement("button");
    b.className=a.primary?"btn":"btn2";
    b.textContent=a.label;
    b.onclick=()=>{ closeModal(); if(a.onClick) a.onClick(); };
    acts.appendChild(b);
  });
  document.getElementById("modal-backdrop").classList.add("show");
  setTimeout(()=>{
    const f=document.querySelector("#modal button, #modal input");
    if(f) f.focus();
  },50);
}
function closeModal(){ document.getElementById("modal-backdrop").classList.remove("show"); }
document.getElementById("modal-backdrop").addEventListener("click",e=>{
  if(e.target.id==="modal-backdrop") closeModal();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="/"){ e.preventDefault(); const s=document.getElementById("globalSearch"); if(s) s.focus(); }
  if(e.key>="1"&&e.key<="5"){
    const map={1:"home",2:"calc",3:"labs",4:"practice",5:"profile"};
    go(map[e.key]);
  }
});

/* Reading time */
function readingTime(text){
  const words=String(text||"").split(/\s+/).length;
  return Math.max(1,Math.round(words/200));
}

function go(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(x=>{
    x.classList.remove("active");
    x.removeAttribute("aria-current");
  });
  const navBtn=btn||document.querySelector(`nav button[data-page="${id}"]`);
  if(navBtn){ navBtn.classList.add("active"); navBtn.setAttribute("aria-current","page"); }

  if(id==="home"){
    /* Home always lands on the level picker */
    learnState={level:null,subject:null,chapter:null,sub:null};
    saveLearnState();
    renderLearn();
  }
  if(id==="calc")     renderCalc();
  if(id==="labs")     renderLabs();
  if(id==="practice") renderPractice();
  if(id==="profile")  renderProfile();

  const ann=document.getElementById("main-content");
  ann.textContent=id.charAt(0).toUpperCase()+id.slice(1)+" page opened.";
  const active=document.querySelector(".page.active .scroll");
  if(active) active.scrollTop=0;
}

function globalSearch(q){
  q=String(q||"").trim().toLowerCase();
  if(!q){ renderLearn(); return; }
  const results=[];
  Object.keys(CURRICULUM).forEach(level=>{
    CURRICULUM[level].forEach((subj,si)=>{
      subj.chapters.forEach((ch,ci)=>{
        const match = ch.topic.toLowerCase().includes(q) || ch.chapter.toLowerCase().includes(q) || subj.subject.toLowerCase().includes(q);
        if(match){
          results.push({type:"Lesson",level,si,ci,topic:ch.topic,subject:subj.subject,chapter:ch.chapter});
        }
      });
    });
  });
  const labs=LABS.filter(l=>l[0].toLowerCase().includes(q)).map(l=>({type:"Lab",name:l[0]}));
  const calcs=CALCS.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q)).map(c=>({type:"Calc",name:c[0]}));

  const p=document.getElementById("learnPage");
  p.innerHTML=`
    <div class="eyebrow">SEARCH</div>
    <h1>Results for "${esc(q)}"</h1>
    <p>${results.length+labs.length+calcs.length} match(es)</p>

    ${results.length?`
    <div class="sectiontitle"><h2>Lessons</h2></div>
    <div class="grid">
      ${results.slice(0,20).map(r=>`
        <div class="topic" onclick="jumpToLesson('${esc(r.level)}',${r.si},${r.ci})">
          <div class="ico">📘</div>
          <b>${esc(r.topic)}</b>
          <small>${esc(r.level)} • ${esc(r.subject)}</small>
        </div>
      `).join("")}
    </div>`:""}

    ${labs.length?`
    <div class="sectiontitle"><h2>Labs</h2></div>
    <div class="grid">
      ${labs.map(l=>`
        <div class="topic" onclick="openLab('${esc(l.name)}')">
          <div class="ico">⚙</div>
          <b>${esc(l.name)}</b>
          <small>Practical guide</small>
        </div>
      `).join("")}
    </div>`:""}

    ${calcs.length?`
    <div class="sectiontitle"><h2>Calculators</h2></div>
    <div class="grid">
      ${calcs.map(c=>{
        const i=CALCS.findIndex(x=>x[0]===c.name);
        return `<div class="topic" onclick="calcState.topic=${i};calcState.sub=null;go('calc')">
          <div class="ico">⚡</div>
          <b>${esc(c.name)}</b>
          <small>Calculator</small>
        </div>`;
      }).join("")}
    </div>`:""}

    ${(!results.length&&!labs.length&&!calcs.length)?'<div class="empty">No results. Try "voltage", "motor", or "ohms".</div>':""}

    <button class="btn2" style="width:100%;margin-top:16px" onclick="renderLearn()">← Back to Home</button>`;
}

function jumpToLesson(level,si,ci){
  learnState={level,subject:si,chapter:ci,sub:null};
  saveLearnState();
  go("home");
  renderLearn();
  selectLearnChapter(ci);
}

function pctLevelProgress(level){
  if(!CURRICULUM[level]) return 0;
  const total=CURRICULUM[level].reduce((n,s)=>n+s.chapters.length*4,0);
  const done=data.learned.filter(id=>id.startsWith(level+"|")).length;
  return total?Math.round(done/total*100):0;
}

function countSubjectLessons(subject){
  let n=0;
  subject.chapters.forEach(ch=>{
    ch.subs.forEach((_,i)=>{
      const id=learnState.level+"|"+subject.subject+"|"+ch.chapter+"|"+ch.topic+"|"+ch.subs[i];
      if(data.learned.includes(id)) n++;
    });
  });
  return n;
}

function openRecent(id){

function getLessonContent(topic,subject){
  if(TEXTBOOK[topic]) return {...TEXTBOOK[topic],key:topic};
  if(TEXTBOOK[subject]) return {
    ...TEXTBOOK[subject], key:subject,
    definition:`${topic} is a topic within ${subject}.`,
    intro:`This is a study of ${topic} as it applies within ${subject}.`
  };
  return {
    key:topic,
    definition:`${topic} is an electrical engineering topic concerned with principles, components, methods or applications associated with ${topic}.`,
    why:`Understanding ${topic} is important for analysing, designing, operating and troubleshooting electrical systems.`,
    objectives:[
      `Understand the meaning and purpose of ${topic}.`,
      `Identify the relevant components and quantities.`,
      `Apply the appropriate engineering principle.`,
      `Check your work carefully.`
    ],
    intro:`This lesson introduces ${topic}. Study it together with related topics in ${subject} to build a complete picture.`,
    theory:`${topic} should be understood through its fundamental principles, physical quantities and practical applications. The exact behaviour depends on the system being studied.`,
    formula:`No single formula applies universally to ${topic}; use the engineering relationship that fits the specific problem.`,
    symbols:`Symbols and units depend on the particular relationship being studied.`,
    example:{problem:`See worked examples for the specific relationship you are using.`,steps:[]},
    applications:[`Relevant to electrical engineering study, practical work, and troubleshooting.`],
    mistakes:[`Using an incorrect formula.`, `Ignoring units.`, `Not checking the result.`],
    summary:[`Review the definition, formula, and applications of ${topic}.`],
    quickCheck:{q:`What is the definition of ${topic}?`,a:`Re-read the definition section.`}
  };
}

function openLesson(sub){

  if(!data.learned.includes(lessonId)){
    data.learned.push(lessonId);
    data.xp+=15;
    logActivity("Learn",c.topic);
    save();
  }

  /* Build sections per sub-topic */

function lessonNext(){

function openRelatedCalc(topic){

}

  return `

      <div class="formula-card">
        <h2>Formula</h2>
        <div style="color:var(--yellow);font-size:19px;font-weight:900">V = I × R</div>
      </div>
      <div class="formrow"><label for="ohmV">Voltage (V)</label><input id="ohmV" type="number" step="any" inputmode="decimal" placeholder="Leave blank if unknown"></div>
      <div class="formrow"><label for="ohmI">Current (A)</label><input id="ohmI" type="number" step="any" inputmode="decimal" placeholder="Leave blank if unknown"></div>
      <div class="formrow"><label for="ohmR">Resistance (Ω)</label><input id="ohmR" type="number" step="any" inputmode="decimal" placeholder="Leave blank if unknown"></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="calculateOhmsLaw()">Calculate</button>
      <button class="btn2" style="width:100%;margin-top:8px" onclick="resetOhmsLaw()">Reset</button>

    </div>`;

function calculateOhmsLaw(){
  const V=parseFloat(document.getElementById("ohmV").value);
  const I=parseFloat(document.getElementById("ohmI").value);
  const R=parseFloat(document.getElementById("ohmR").value);
  const hasV=Number.isFinite(V), hasI=Number.isFinite(I), hasR=Number.isFinite(R);
  if((hasV?1:0)+(hasI?1:0)+(hasR?1:0)!==2){ ohmError("Enter exactly two known values."); return; }
  let answer,unit,formula,steps,explanation;
  if(!hasI){
    if(R===0){ ohmError("Resistance cannot be zero."); return; }
    answer=V/R; unit="A"; formula="I = V / R";
    steps=`I = V / R<br>I = ${V} / ${R}<br>I = ${fmt(answer)} A`;
    explanation="Current from voltage divided by resistance.";
  }else if(!hasV){
    answer=I*R; unit="V"; formula="V = I × R";
    steps=`V = I × R<br>V = ${I} × ${R}<br>V = ${fmt(answer)} V`;
    explanation="Voltage from current times resistance.";
  }else{
    if(I===0){ ohmError("Current cannot be zero."); return; }
    answer=V/I; unit="Ω"; formula="R = V / I";
    steps=`R = V / I<br>R = ${V} / ${I}<br>R = ${fmt(answer)} Ω`;
    explanation="Resistance from voltage divided by current.";
  }
  if(!Number.isFinite(answer)){ ohmError("Invalid result."); return; }
  data.calculations++; data.xp+=5;
  logActivity("Calculation","Ohm's Law"); save();
  document.getElementById("ohmResult").innerHTML=resultBox(answer,unit,formula,steps,explanation);
}
function ohmError(msg){
  document.getElementById("ohmResult").innerHTML=`<div class="notice" style="border-color:var(--red);color:var(--red)">${esc(msg)}</div>`;
}
function resetOhmsLaw(){
  ["ohmV","ohmI","ohmR"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
  document.getElementById("ohmResult").innerHTML="";
}
function resultBox(value,unit,formula,steps,explanation){

    <div class="calc-answer">
      <div style="font-size:10px;color:var(--blue);font-weight:900">FINAL ANSWER</div>
      <div class="big"><span>${fmt(value)}</span><span class="unit">${esc(unit)}</span></div>
      <h3 style="color:var(--blue);margin-top:15px;text-transform:uppercase;font-size:12px">Formula used</h3>
      <div class="answerbox">${formula}</div>
      <h3 style="color:var(--blue);margin-top:15px;text-transform:uppercase;font-size:12px">Step-by-step</h3>
      <div class="answerbox">${steps}</div>
      ${explanation?`<h3 style="color:var(--blue);margin-top:15px;text-transform:uppercase;font-size:12px">Explanation</h3><p>${esc(explanation)}</p>`:""}
      <button class="btn2" style="width:100%;margin-top:12px" onclick="copyResult('${fmt(value)} ${esc(unit)}')">⧉ Copy result</button>
    </div>`;

function copyResult(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Copied")).catch(()=>toast("Copy failed","err"));
  }else{ toast("Clipboard unavailable","warn"); }

function n(id){
  const el=document.getElementById(id);
  if(!el) return NaN;
  const x=parseFloat(el.value);
  return Number.isFinite(x)?x:NaN;
}
function generalResult(value,unit,formula,steps,explanation){
  if(!Number.isFinite(value)){
    document.getElementById("calcResult").innerHTML=`<div class="notice" style="border-color:var(--red);color:var(--red)">Enter valid values.</div>`;
    return;
  }
  data.calculations++; data.xp+=5;
  logActivity("Calculation",CALCS[calcState.topic][0]); save();
  document.getElementById("calcResult").innerHTML=resultBox(value,unit,formula,steps,explanation);
}
function doGeneralCalc(){
  const name=CALCS[calcState.topic][0];
  let value,unit,formula,steps,explanation;
  try{
    switch(name){
      case"Electrical Power":{
        const v=n("cv"),i=n("ci"); value=v*i; unit="W"; formula="P = VI";
        steps=`P = ${v} × ${i} = ${fmt(value)} W`; explanation="Power is voltage times current."; break;
      }
      case"Electrical Energy":{
        const p=n("cp"),t=n("ct"); value=p*t; unit="Wh"; formula="E = Pt";
        steps=`E = ${p} × ${t} = ${fmt(value)} Wh`; explanation="Energy is power times time."; break;
      }
      case"AC Circuits":{
        const r=n("cr"),x=n("cx"); value=Math.sqrt(r*r+x*x); unit="Ω"; formula="Z = √(R² + X²)";
        steps=`Z = √(${r}² + ${x}²) = ${fmt(value)} Ω`; break;
      }
      case"Impedance":{
        const v=n("cv"),i=n("ci"); if(i===0){ generalResult(NaN); return; }
        value=v/i; unit="Ω"; formula="Z = V/I"; steps=`Z = ${v} / ${i} = ${fmt(value)} Ω`; break;
      }
      case"Power Factor":{
        const p=n("cp"),s=n("cs"); if(s===0){ generalResult(NaN); return; }
        value=p/s; unit=""; formula="PF = P/S"; steps=`PF = ${p} / ${s} = ${fmt(value)}`; break;
      }
      case"Single-Phase Systems":{
        const v=n("cv"),i=n("ci"),pf=n("cpf"); value=v*i*pf; unit="W"; formula="P = VIcosφ";
        steps=`P = ${v} × ${i} × ${pf} = ${fmt(value)} W`; break;
      }
      case"Three-Phase Systems":{
        const v=n("cv"),i=n("ci"),pf=n("cpf"); value=Math.sqrt(3)*v*i*pf; unit="W"; formula="P = √3VIcosφ";
        steps=`P = √3 × ${v} × ${i} × ${pf} = ${fmt(value)} W`; break;
      }
      case"Transformers":{
        const vp=n("vp"),np=n("np"),ns=n("ns"); if(np===0){ generalResult(NaN); return; }
        value=vp*ns/np; unit="V"; formula="Vs = Vp × Ns/Np";
        steps=`Vs = ${vp} × ${ns}/${np} = ${fmt(value)} V`; break;
      }
      case"AC Motors":{
        const f=n("cf"),poles=n("cpoles"); if(poles===0){ generalResult(NaN); return; }
        value=120*f/poles; unit="rpm"; formula="Ns = 120f/P";
        steps=`Ns = 120 × ${f} / ${poles} = ${fmt(value)} rpm`; break;
      }
      case"Voltage Drop":{
        const i=n("ci"),r=n("cr"); value=i*r; unit="V"; formula="Vd = IR";
        steps=`Vd = ${i} × ${r} = ${fmt(value)} V`; break;
      }
      case"Solar PV Systems":{
        const v=n("cv"),i=n("ci"); value=v*i; unit="W"; formula="P = VI";
        steps=`P = ${v} × ${i} = ${fmt(value)} W`; break;
      }
      case"Electricity Consumption & Cost":{
        const kwh=n("ckwh"),rate=n("crate"); value=kwh*rate; unit=""; formula="Cost = kWh × Rate";
        steps=`Cost = ${kwh} × ${rate} = ${fmt(value)}`; break;
      }
      case"Engineering Unit Conversions":{
        const v=n("cvalue"),f=n("cfactor"); value=v*f; unit=""; formula="Result = Value × Factor";
        steps=`Result = ${v} × ${f} = ${fmt(value)}`; break;
      }
      default:{ const v=n("cv"),i=n("ci"); if(i===0){ generalResult(NaN); return; }
        value=v/i; unit=""; formula="Engineering relationship"; steps=`Result = ${fmt(value)}`; }
    }
  }catch(e){ generalResult(NaN); return; }
  generalResult(value,unit,formula,steps,explanation);
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getTheoryTopics(){
  if(_theoryCache) return _theoryCache;
  const all=[];
  Object.keys(CURRICULUM).forEach(level=>{
    CURRICULUM[level].forEach(subject=>{
      subject.chapters.forEach(ch=>{
        const content=getLessonContent(ch.topic,subject.subject);
        if(content.definition){
          all.push({
            level, subject:subject.subject, title:ch.topic,
            question:{
              q:`Which statement best describes "${ch.topic}"?`,
              a:[
                content.definition,
                "It is unrelated to electrical engineering.",
                "It is only a mechanical tool.",
                "It is only a programming command."
              ],
              correct:0,
              why:content.why||content.importance
            }
          });
        }
      });
    });
  });
  _theoryCache=all;
  return all;
}
