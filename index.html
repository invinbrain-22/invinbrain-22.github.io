function startTheoryPractice(i){
  const all=getTheoryTopics();
  const item=all[i];
  const others=shuffle(all.filter((_,j)=>j!==i)).slice(0,4);
  const set=[item,...others];
  practiceQuestions=set.map(x=>{
    const answers=shuffle(x.question.a.map((text,idx)=>({text,correct:idx===x.question.correct})));
    return {
      q:x.question.q,
      a:answers.map(a=>a.text),
      correct:answers.findIndex(a=>a.correct),
      why:x.question.why
    };
  });
  practiceIndex=0; practiceScore=0; practiceTopic=item.title;
  renderPracticeQuestion();
}
function startPracticalPractice(i){
  const x=PRACTICAL_Q[i];
  const answers=shuffle(x[2].map((text,idx)=>({text,correct:idx===x[3]})));
  practiceQuestions=[{
    q:x[1],
    a:answers.map(a=>a.text),
    correct:answers.findIndex(a=>a.correct),
    why:"This practical knowledge is associated with the selected ElectroBrain Lab."
  }];
  practiceIndex=0; practiceScore=0; practiceTopic=x[0];
  renderPracticeQuestion();
}
function renderPracticeQuestion(){
  const q=practiceQuestions[practiceIndex];
  if(!q){ finishPractice(); return; }
  document.getElementById("practicePage").innerHTML=`
    <button class="back" onclick="practiceQuestions=[];renderPractice()">← Practice Library</button>
    <div class="eyebrow">${esc(practiceTopic)} • QUESTION ${practiceIndex+1} / ${practiceQuestions.length}</div>
    <div class="quiz">
      <div class="question">${esc(q.q)}</div>
      <div class="answers">
        ${q.a.map((a,i)=>`<button class="answer" onclick="answerPractice(${i},${q.correct})">${esc(a)}</button>`).join("")}
      </div>
      <div id="practiceFeedback"></div>
    </div>`;
}
function answerPractice(selected,correct){
  const buttons=document.querySelectorAll(".answer");
  buttons.forEach((b,i)=>{
    b.disabled=true;
    if(i===correct) b.classList.add("correct");
    if(i===selected&&selected!==correct) b.classList.add("wrong");
  });
  const ok=selected===correct;
  if(ok) practiceScore++;
  data.attempts++; data.practice++;
  if(ok){ data.correct++; data.xp+=10; }
  logActivity("Practice",practiceTopic);
  save();
  document.getElementById("practiceFeedback").innerHTML=`
    <div class="feedback">
      <b style="color:${ok?"var(--green)":"var(--red)"}">${ok?"Correct":"Incorrect"}</b>
      <br><br>
      ${esc(practiceQuestions[practiceIndex].why)}
      <button class="btn" style="width:100%;margin-top:12px" onclick="nextPractice()">
        ${practiceIndex+1<practiceQuestions.length?"Next":"Finish"}
      </button>
    </div>`;
}
function nextPractice(){ practiceIndex++; renderPracticeQuestion(); }
function finishPractice(){
  const pct=practiceQuestions.length?Math.round(practiceScore/practiceQuestions.length*100):0;
  document.getElementById("practicePage").innerHTML=`
    <div class="eyebrow">PRACTICE COMPLETE</div>
    <h1>${esc(practiceTopic)}</h1>
    <div class="result">
      <div>SCORE</div>
      <strong>${pct}%</strong>
      <p style="margin-top:8px">${practiceScore}/${practiceQuestions.length} correct</p>
    </div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="practiceQuestions=[];renderPractice()">Back to Practice</button>
    <button class="btn2" style="width:100%;margin-top:8px" onclick="go('profile')">View Profile</button>`;
  practiceQuestions=[];
}

/* =========================================================
   PROFILE
   ========================================================= */

function renderProfile(){
  const accuracy=data.attempts?Math.round(data.correct/data.attempts*100):0;
  const total=data.learned.length+data.practice+data.labs+data.calculations;
  const progress=Math.min(100,total);
  const achievements=[
    ["⚡","First Calculation",data.calculations>=1],
    ["📘","First Lesson",data.learned.length>=1],
    ["✓","Practice Started",data.practice>=1],
    ["🧪","First Lab",data.labs>=1],
    ["🏆","10 Questions",data.attempts>=10],
    ["⚙️","100 XP",data.xp>=100],
    ["🔥","3-Day Streak",data.streak>=3],
    ["📚","10 Lessons",data.learned.length>=10]
  ];

  document.getElementById("profilePage").innerHTML=`
    <div class="profilehero">
      <div class="avatar" aria-hidden="true">⚡</div>
      <div>
        <div class="eyebrow">ENGINEERING PROFILE</div>
        <h1>${esc(data.name)}</h1>
        <p>${esc(data.level)} • 🔥 ${data.streak||0}-day streak</p>
      </div>
      <button class="iconbtn" onclick="editProfile()" aria-label="Edit profile">✎</button>
    </div>

    <div class="grid4" style="margin-top:10px">
      <div class="metric"><b>${data.xp}</b><span>XP</span></div>
      <div class="metric"><b>${data.learned.length}</b><span>Lessons</span></div>
      <div class="metric"><b>${data.labs}</b><span>Labs</span></div>
      <div class="metric"><b>${data.calculations}</b><span>Calculations</span></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h2>Performance</h2>
      <div style="display:flex;justify-content:space-between;margin:10px 0"><span>Practice accuracy</span><b>${accuracy}%</b></div>
      <div class="progress"><i style="width:${accuracy}%"></i></div>
      <div style="display:flex;justify-content:space-between;margin:15px 0 10px"><span>Overall activity</span><b>${progress}%</b></div>
      <div class="progress"><i style="width:${progress}%"></i></div>
    </div>

    <div style="margin-top:20px">
      <h2>Achievements</h2>
      <div class="grid">
        ${achievements.map(x=>`
          <div class="badge ${x[2]?"":"locked"}">
            <b>${x[0]} ${esc(x[1])}</b>
            <small>${x[2]?"Unlocked":"Locked"}</small>
          </div>`).join("")}
      </div>
    </div>

    <div style="margin-top:20px">
      <h2>Account & Data</h2>
      <div class="menu">
        <button onclick="editProfile()">👤<span><b>Profile Details</b><small>Name and academic level</small></span>›</button>
        <button onclick="showBookmarks()">🔖<span><b>Bookmarks</b><small>${data.bookmarks.length} saved lessons</small></span>›</button>
        <button onclick="showActivity()">◷<span><b>Recent Activity</b><small>${data.activity.length} records</small></span>›</button>
        <button onclick="resetData()">⚙️<span><b>Reset Local Progress</b><small>Clear data stored on this device</small></span>›</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;text-align:center">
      <h2>ElectroBrain ⚡</h2>
      <p>Learn • Calculate • Experiment</p>
      <p style="margin-top:7px">Created by Richmond Owusu</p>
      <p style="margin-top:4px">SHS • TVET • University 100–400</p>
      <p style="margin-top:8px;color:var(--blue)">WhatsApp: 0544920538</p>
    </div>`;
}

function editProfile(){
  openModal({
    title:"Edit Profile",
    bodyHtml:`
      <div class="formrow"><label for="pf-name">Display name</label><input id="pf-name" type="text" maxlength="40" value="${esc(data.name)}"></div>
      <div class="formrow"><label for="pf-level">Academic level</label>
        <select id="pf-level">${LEVELS.map(l=>`<option value="${esc(l)}" ${l===data.level?"selected":""}>${esc(l)}</option>`).join("")}</select>
      </div>`,
    actions:[
      {label:"Cancel"},
      {label:"Save",primary:true,onClick:()=>{
        const name=document.getElementById("pf-name").value.trim().slice(0,40);
        const level=document.getElementById("pf-level").value;
        if(name) data.name=name;
        if(LEVELS.includes(level)) data.level=level;
        save(); renderProfile(); toast("Profile updated");
      }}
    ]
  });
}
function showBookmarks(){
  const items=data.bookmarks.length
    ? `<ul class="modal-list">${data.bookmarks.map(b=>{
        const parts=b.split("|");
        return `<li>${esc(parts[parts.length-2]||b)} — ${esc(parts[parts.length-1]||"")}</li>`;
      }).join("")}</ul>`
    : `<p>No bookmarks yet. Bookmark a lesson from the lesson page.</p>`;
  openModal({title:"Bookmarked Lessons",bodyHtml:items,actions:[{label:"Close",primary:true}]});
}
function showActivity(){
  const items=data.activity.length
    ? `<ul class="modal-list">${data.activity.slice(0,15).map(a=>`<li>${esc(a.type)}: ${esc(a.title)}</li>`).join("")}</ul>`
    : `<p>No recent activity yet.</p>`;
  openModal({title:"Recent Activity",bodyHtml:items,actions:[{label:"Close",primary:true}]});
}
function resetData(){
  openModal({
    title:"Reset progress?",
    bodyHtml:`<p>This clears all ElectroBrain progress stored on this device. It cannot be undone.</p>`,
    actions:[
      {label:"Cancel"},
      {label:"Reset",primary:true,onClick:()=>{
        try{ localStorage.removeItem(KEY); }catch(e){}
        try{ localStorage.removeItem(LEARN_KEY); }catch(e){}
        try{ localStorage.removeItem(RECENT_KEY); }catch(e){}
        data=defaultData(); data.streak=1; data.lastVisit=Date.now();
        _theoryCache=null;
        learnState={level:null,subject:null,chapter:null,sub:null};
        calcState={topic:null,sub:null};
        practiceQuestions=[]; practiceIndex=0; practiceScore=0;
        renderLearn(); renderCalc(); renderLabs(); renderPractice(); renderProfile();
        toast("Progress reset");
      }}
    ]
  });
}

/* =========================================================
   WELCOME / BOOT
   ========================================================= */

function showWelcomeIfFirst(){
  try{
    if(localStorage.getItem(WELCOME_KEY)) return;
    localStorage.setItem(WELCOME_KEY,"1");
  }catch(e){ return; }
  openModal({
    title:"Welcome to ElectroBrain ⚡",
    bodyHtml:`
      <p>Your electrical engineering study companion.</p>
      <ul style="margin-top:10px;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.8">
        <li><b>Learn</b> — textbook-style lessons for SHS, TVET and University 100–400.</li>
        <li><b>Calculate</b> — smart engineering calculators with step-by-step results.</li>
        <li><b>Labs</b> — step-by-step practical guides with wiring diagrams.</li>
        <li><b>Practice</b> — theory and practical quizzes.</li>
        <li><b>Profile</b> — track XP, streaks, and progress.</li>
      </ul>
      <p style="margin-top:10px;font-size:11px;color:var(--muted)">Tip: press <kbd>/</kbd> to search, or 1–5 to jump tabs.</p>`,
    actions:[{label:"Start learning",primary:true}]
  });
}

/* Boot */
applyTheme();
learnState={level:null,subject:null,chapter:null,sub:null};
saveLearnState();
renderLearn();
save();
showWelcomeIfFirst();

(function markHome(){
  const b=document.querySelector('nav button[data-page="home"]');
  if(b){ b.classList.add("active"); b.setAttribute("aria-current","page"); }
})();

</script>
</body>
</html>
