<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ElectroBrain ⚡</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#050b14;--panel:#07111e;--card:#0c1828;--card2:#102033;
--border:#1d3149;--border2:#29405b;--text:#f4f8ff;--muted:#9db0c8;
--blue:#37a8ff;--yellow:#ffd43b;--green:#45d483;--red:#ff6978
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.top{
height:64px;position:fixed;top:0;left:0;right:0;z-index:100;
display:flex;align-items:center;justify-content:center;
background:var(--panel);border-bottom:1px solid var(--border)
}
.logo{font-size:20px;font-weight:900}
.logo span{color:var(--blue)}
.logo b{color:var(--yellow)}
.page{
position:fixed;top:64px;bottom:64px;left:0;right:0;
display:none;background:var(--bg)
}
.page.active{display:block}
.scroll{
height:100%;overflow:auto;padding:20px 14px 100px;
max-width:1000px;margin:auto
}
nav{
position:fixed;bottom:0;left:0;right:0;height:64px;z-index:100;
display:grid;grid-template-columns:repeat(5,1fr);
background:var(--panel);border-top:1px solid var(--border)
}
nav button{
border:0;background:none;color:var(--muted);font-size:10px
}
nav button.active{color:var(--blue)}
.navicon{display:block;font-size:19px;margin-bottom:3px}
h1{font-size:28px;margin:5px 0 7px}
h2{font-size:19px;margin-bottom:7px}
h3{font-size:16px}
p{color:var(--muted);font-size:13px;line-height:1.55}
.eyebrow{
font-size:10px;letter-spacing:1.6px;color:var(--blue);
font-weight:900
}
.card{
background:var(--card);border:1px solid var(--border);
border-radius:17px;padding:16px
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{
border:0;border-radius:12px;padding:12px;background:var(--blue);
color:#04101d;font-weight:900
}
.btn2{
border:1px solid var(--border2);border-radius:12px;padding:11px;
background:var(--panel);color:var(--text);font-weight:800
}
.search{
width:100%;padding:13px;border:1px solid var(--border2);
border-radius:12px;background:var(--panel);color:var(--text);
outline:none
}
.tabs{
display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
background:var(--panel);border:1px solid var(--border);
padding:5px;border-radius:14px;margin:14px 0
}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs button{
border:0;background:transparent;color:var(--muted);
padding:11px;border-radius:10px;font-weight:900
}
.tabs button.active{
background:var(--card);color:var(--text);
box-shadow:inset 0 0 0 1px var(--blue)
}
.topic{
padding:15px;border:1px solid var(--border);
border-radius:15px;background:var(--card);cursor:pointer
}
.topic:hover{border-color:var(--blue)}
.topic .ico{font-size:23px;margin-bottom:9px}
.topic small{
display:block;color:#8295ad;margin-top:5px;font-size:11px
}
.back{
border:0;background:none;color:var(--blue);
font-weight:800;padding:8px 0;margin-bottom:8px
}
.notice{
padding:12px;border-radius:12px;background:#07111e;
border:1px solid var(--border);color:var(--muted);
font-size:12px;line-height:1.5;margin:12px 0
}
.result{
padding:17px;border-radius:16px;background:#071a18;
border:1px solid #246149;margin-top:12px
}
.result strong{color:var(--green);font-size:24px}
.formrow{margin:10px 0}
.formrow label{
display:block;color:var(--muted);font-size:11px;margin-bottom:5px
}
.formrow input,.formrow select{
width:100%;padding:12px;border:1px solid var(--border2);
border-radius:10px;background:var(--panel);color:var(--text)
}
.lesson{
background:var(--card);border:1px solid var(--border);
border-radius:18px;padding:18px;line-height:1.6
}
.lesson .diagram{
margin:15px 0;padding:25px;text-align:center;
border:1px dashed var(--border2);border-radius:14px;
font-size:42px;background:#07111e
}
.lesson .formula{
margin:14px 0;padding:15px;text-align:center;
background:#07111e;border-radius:12px;color:var(--yellow);
font-size:20px;font-weight:900
}
.lesson h3{
margin-top:20px;margin-bottom:7px;color:var(--blue)
}
.lesson ul{
padding-left:20px;color:var(--muted);font-size:13px
}
.lesson li{margin:5px 0}
.answerbox{
padding:13px;background:#07111e;border-radius:12px;margin-top:10px;
color:var(--muted);font-size:13px;line-height:1.6
}
.lessonnav{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px
}
.lessonnav button{
padding:12px;border-radius:11px;border:1px solid var(--border2);
background:var(--panel);color:var(--text)
}
.quiz{
padding:18px;background:var(--card);
border:1px solid var(--border);border-radius:17px
}
.question{font-size:19px;line-height:1.4;margin:13px 0}
.answers{display:grid;gap:9px}
.answer{
text-align:left;width:100%;padding:13px;border-radius:11px;
border:1px solid var(--border2);background:var(--panel);color:var(--text)
}
.answer.correct{border-color:var(--green)}
.answer.wrong{border-color:var(--red)}
.feedback{
padding:13px;margin-top:13px;background:#07111e;
border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5
}
.profilehero{
display:flex;align-items:center;gap:13px;padding:18px;
background:linear-gradient(135deg,#0c1828,#07111e);
border:1px solid var(--border);border-radius:20px
}
.avatar{
width:58px;height:58px;display:grid;place-items:center;
border-radius:16px;background:#102a43;border:1px solid var(--blue);
font-size:27px;color:var(--yellow)
}
.profilehero>div:nth-child(2){flex:1}
.iconbtn{
border:1px solid var(--border2);background:var(--panel);
color:var(--text);padding:9px;border-radius:10px
}
.metric{
padding:14px;text-align:center;background:var(--card);
border:1px solid var(--border);border-radius:15px
}
.metric b{display:block;font-size:20px;color:var(--blue)}
.metric span{font-size:10px;color:var(--muted)}
.progress{
height:8px;background:#07111e;border-radius:99px;overflow:hidden
}
.progress i{display:block;height:100%;width:0;background:var(--blue)}
.badge{
padding:14px;background:var(--card);
border:1px solid var(--border);border-radius:15px
}
.badge small{display:block;color:var(--muted);margin-top:5px}
.menu{
overflow:hidden;background:var(--card);
border:1px solid var(--border);border-radius:16px
}
.menu button{
width:100%;display:flex;gap:12px;align-items:center;
padding:14px;border:0;border-bottom:1px solid var(--border);
background:none;color:var(--text);text-align:left
}
.menu button:last-child{border:0}
.menu span{flex:1}
.menu small{
display:block;color:var(--muted);margin-top:3px;font-size:11px
}

/* LAB */
.labhero{
padding:18px;background:linear-gradient(135deg,#0c1828,#07111e);
border:1px solid var(--border);border-radius:18px
}
.labvisual{
height:150px;border:1px solid var(--border2);border-radius:15px;
display:grid;place-items:center;background:#07111e;
font-size:60px;margin:12px 0
}
.labsection{
margin-top:12px;padding:15px;background:var(--card);
border:1px solid var(--border);border-radius:16px
}
.labsteps{display:grid;gap:8px;margin:12px 0}
.step{
padding:12px;border:1px solid var(--border);
background:#07111e;border-radius:11px;color:var(--muted);
font-size:13px
}
.step b{color:var(--blue);margin-right:7px}
.workshop{
background:#06101b;border:1px solid var(--border);
border-radius:18px;padding:15px;margin-top:12px
}
.bench{
min-height:300px;padding:15px;border:1px solid var(--border2);
border-radius:15px;background:#081522;position:relative
}
.equipment{
display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.equipment button{
min-height:82px;border:1px solid var(--border2);
border-radius:13px;background:var(--card);color:var(--text);
font-size:12px
}
.equipment button.selected{
border-color:var(--blue);
box-shadow:0 0 0 1px var(--blue)
}
.terminal-board{
margin-top:15px;padding:14px;border:1px dashed var(--border2);
border-radius:14px;background:#050d16
}
.terminal{
display:inline-flex;align-items:center;justify-content:center;
min-width:54px;height:35px;margin:4px;padding:5px 8px;
border:1px solid var(--border2);border-radius:8px;
font-size:11px;color:var(--muted)
}
.terminal.target{
border-color:var(--yellow);color:var(--yellow)
}
.wires{
display:grid;gap:8px;margin-top:13px
}
.wireitem{
display:flex;align-items:center;gap:8px;
padding:8px;border:1px solid var(--border);
border-radius:10px;background:#07111e
}
.conductor{
width:28px;height:10px;border-radius:5px;
display:inline-block
}
.brown{background:#8b5a2b}
.bluewire{background:#3186d1}
.pe{background:#54c96b}
.dragwire{
cursor:grab;border:1px solid var(--border2);
padding:8px;border-radius:9px;background:var(--card);
color:var(--text);font-size:11px
}
.dropzone{
flex:1;min-height:34px;border:1px dashed var(--border2);
border-radius:8px;display:flex;align-items:center;
padding:5px;color:var(--muted);font-size:10px
}
.dropzone.connected{
border-color:var(--green);color:var(--green)
}
.toolgrid{
display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px
}
.tool{
padding:10px;text-align:center;border:1px solid var(--border);
border-radius:10px;background:#07111e;font-size:11px
}

/* CALC */
.calc-actions{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px
}
.calc-answer{
padding:16px;margin-top:12px;background:#071a18;
border:1px solid #246149;border-radius:15px
}
.calc-answer .big{
font-size:27px;color:var(--green);font-weight:900;margin:5px 0
}
.formula-card{
padding:15px;background:#07111e;border-radius:13px;
border:1px solid var(--border)
}

/* HOME */
.homehero{
padding:20px;border-radius:20px;
background:linear-gradient(135deg,#0d2034,#07111e);
border:1px solid var(--border)
}
.quick{
display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px
}
.quick button{
padding:12px;border-radius:12px;border:1px solid var(--border2);
background:var(--card);color:var(--text);font-size:11px
}
.sectiontitle{
display:flex;justify-content:space-between;align-items:center;
margin:20px 0 10px
}

@media(max-width:600px){
.grid4{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.equipment{grid-template-columns:repeat(2,1fr)}
.toolgrid{grid-template-columns:repeat(2,1fr)}
.quick{grid-template-columns:repeat(2,1fr)}
.scroll{padding-left:12px;padding-right:12px}
}
</style>
</head>

function cleanKey(subject){
if(TEXTBOOK[subject])return subject;
if(subject.includes("Circuit"))return "Ohm's Law";
if(subject.includes("Motor"))return "Induction Motors";
if(subject.includes("Transformer"))return "Transformers";
if(subject.includes("PLC"))return "PLC Fundamentals";
if(subject.includes("VFD")||subject.includes("Drives"))
return "Variable Frequency Drives";
if(subject.includes("Solar")||subject.includes("Renewable"))
return "Solar PV Systems";
if(subject.includes("Power"))return "Power";
if(subject.includes("Measurement")||subject.includes("Instrumentation"))
return "Current";
if(subject.includes("Resistance")||subject.includes("Resistor"))
return "Resistance";
if(subject.includes("Voltage"))return "Voltage";
if(subject.includes("Current"))return "Current";
return "Ohm's Law";
}

missing quantity automatically.

function calculateOhmsLaw(){

const V=parseFloat(document.getElementById("ohmV").value);
const I=parseFloat(document.getElementById("ohmI").value);
const R=parseFloat(document.getElementById("ohmR").value);

const hasV=Number.isFinite(V);
const hasI=Number.isFinite(I);
const hasR=Number.isFinite(R);

if((hasV?1:0)+(hasI?1:0)+(hasR?1:0)!==2){
document.getElementById("ohmResult").innerHTML=`
<div class="notice" style="border-color:var(--red);color:var(--red)">
Enter exactly two known values.
</div>`;
return;
}

let answer,unit,formula,steps,explanation;

if(!hasI){

if(R===0){
showOhmError("Resistance cannot be zero for this calculation.");
return;
}

answer=V/R;
unit="A";
formula="I = V / R";
steps=
`I = V / R<br>
I = ${V} / ${R}<br>
I = ${answer}`;
explanation="Current was calculated from voltage divided by resistance.";

}

else if(!hasV){

answer=I*R;
unit="V";
formula="V = I × R";
steps=
`V = I × R<br>
V = ${I} × ${R}<br>
V = ${answer}`;
explanation="Voltage was calculated by multiplying current by resistance.";

}

else{

if(I===0){
showOhmError("Current cannot be zero when calculating resistance.");
return;
}

answer=V/I;
unit="Ω";
formula="R = V / I";
steps=
`R = V / I<br>
R = ${V} / ${I}<br>
R = ${answer}`;
explanation="Resistance was calculated from voltage divided by current.";
}

if(!Number.isFinite(answer)){
showOhmError("The entered values produced an invalid result.");
return;
}

data.calculations++;
data.xp+=5;
logActivity("Calculation","Ohm's Law");
save();

const formatted=Number(answer.toFixed(6)).toString();

document.getElementById("ohmResult").innerHTML=`
<div class="calc-answer">

<div style="font-size:10px;color:var(--blue);font-weight:900">
FINAL ANSWER
</div>

<div class="big">${formatted} ${unit}</div>

<h3 style="color:var(--blue);margin-top:15px">
Formula Used
</h3>

<div class="answerbox">${formula}</div>

<h3 style="color:var(--blue);margin-top:15px">
Step-by-Step Solution
</h3>

<div class="answerbox">${steps}</div>

<h3 style="color:var(--blue);margin-top:15px">
Explanation
</h3>

<p>${explanation}</p>

</div>`;
}

document.getElementById("ohmResult").innerHTML=`

${esc(msg)}
</div>`;
}

unit="Wh";
formula="E = Pt";
steps=`E = ${n("cp")} × ${n("ct")} = ${value} Wh`;
break;

case"AC Circuits":
value=Math.sqrt(n("cr")**2+n("cx")**2);
unit="Ω";
formula="Z = √(R² + X²)";
steps=`Z = √(${n("cr")}² + ${n("cx")}²) = ${value} Ω`;
break;

case"Impedance":
value=n("cv")/n("ci");
unit="Ω";
formula="Z = V/I";
steps=`Z = ${n("cv")} / ${n("ci")} = ${value} Ω`;
break;

case"Power Factor":
value=n("cp")/n("cs");
unit="";
formula="PF = P/S";
steps=`PF = ${n("cp")} / ${n("cs")} = ${value}`;
break;

case"Single-Phase Systems":
value=n("cv")*n("ci")*n("cpf");
unit="W";
formula="P = VIcosφ";
steps=`P = ${n("cv")} × ${n("ci")} × ${n("cpf")} = ${value} W`;
break;

case"Three-Phase Systems":
value=Math.sqrt(3)*n("cv")*n("ci")*n("cpf");
unit="W";
formula="P = √3VIcosφ";
steps=`P = √3 × ${n("cv")} × ${n("ci")} × ${n("cpf")} = ${value} W`;
break;

case"Transformers":
value=n("vp")*n("ns")/n("np");
unit="V";
formula="Vs = Vp × Ns/Np";
steps=`Vs = ${n("vp")} × ${n("ns")}/${n("np")} = ${value} V`;
break;

case"AC Motors":
value=120*n("cf")/n("cpoles");
unit="rpm";
formula="Ns = 120f/P";
steps=`Ns = 120 × ${n("cf")} / ${n("cpoles")} = ${value} rpm`;
break;

case"Voltage Drop":
value=n("ci")*n("cr");
unit="V";
formula="Vd = IR";
steps=`Vd = ${n("ci")} × ${n("cr")} = ${value} V`;
break;

case"Solar PV Systems":
value=n("cv")*n("ci");
unit="W";
formula="P = VI";
steps=`P = ${n("cv")} × ${n("ci")} = ${value} W`;
break;

case"Electricity Consumption & Cost":
value=n("ckwh")*n("crate");
unit="";
formula="Cost = kWh × Rate";
steps=`Cost = ${n("ckwh")} × ${n("crate")} = ${value}`;
break;

case"Engineering Unit Conversions":
value=n("cvalue")*n("cfactor");
unit="";
formula="Result = Value × Conversion Factor";
steps=`Result = ${n("cvalue")} × ${n("cfactor")} = ${value}`;
break;

default:
value=n("cv")/n("ci");
unit="";
formula="Engineering relationship";
steps=`Result = ${value}`;
}

generalResult(value,unit,formula,steps);
}

function workshopSelect(name,el){

el.classList.toggle("selected");

if(el.classList.contains("selected")){
workshopState.selected.push(name);
recordWorkshopAction("Selected "+name);
}else{
workshopState.selected=
workshopState.selected.filter(x=>x!==name);
recordWorkshopAction("Removed "+name);
}
}

function recordWorkshopAction(action){
workshopState.actions.push({
action,
time:Date.now()
});
}

function dropConductor(event,wire,target){

event.preventDefault();

const dropped=event.dataTransfer.getData("conductor");

if(dropped!==wire){

showWorkshopMessage(
"Incorrect simulated terminal placement. Review the conductor identification."
);

recordWorkshopAction(
"Incorrect connection: "+dropped+" → "+target
);

return;
}

workshopState.connections[wire]=target;

const zone=event.currentTarget;
zone.classList.add("connected");
zone.innerHTML="✓ "+wire+" conductor connected";

recordWorkshopAction(
"Connected "+wire+" conductor → "+target
);
}

function showWorkshopMessage(msg){

const old=document.getElementById("workshopMessage");

if(old)old.remove();

const div=document.createElement("div");

div.id="workshopMessage";
div.className="notice";
div.style.borderColor="var(--yellow)";
div.style.color="var(--yellow)";
div.innerHTML=esc(msg);

document.querySelector(".workshop")
.appendChild(div);
}

function answerPractice(selected,correct){

const buttons=document.querySelectorAll(".answer");

buttons.forEach((b,i)=>{
b.disabled=true;
if(i===correct)b.classList.add("correct");
if(i===selected&&selected!==correct)b.classList.add("wrong");
});

const ok=selected===correct;

if(ok)practiceScore++;

data.attempts++;
data.practice++;

if(ok){
data.correct++;
data.xp+=10;
}

logActivity("Practice",practiceTopic);
save();

document.getElementById("practiceFeedback").innerHTML=`

<div class="feedback">

<b style="color:${ok?"var(--green)":"var(--red)"}">
${ok?"Correct":"Incorrect"}
</b>

<br><br>

${esc(practiceQuestions[practiceIndex].why)}

<button class="btn" style="width:100%;margin-top:12px"
onclick="nextPractice()">
${practiceIndex+1<practiceQuestions.length?"Next":"Finish"}
</button>

</div>`;
}

function nextPractice(){
practiceIndex++;
renderPracticeQuestion();
}

function finishPractice(){

const pct=practiceQuestions.length?
Math.round(practiceScore/practiceQuestions.length*100):0;

document.getElementById("practicePage").innerHTML=`

<div class="eyebrow">PRACTICE COMPLETE</div>
<h1>${esc(practiceTopic)}</h1>

<div class="result">
<div>SCORE</div>
<strong>${pct}%</strong>
<p style="margin-top:8px">
${practiceScore}/${practiceQuestions.length} correct
</p>
</div>

<button class="btn" style="width:100%;margin-top:12px"
onclick="practiceQuestions=[];renderPractice()">
Back to Practice
</button>

<button class="btn2" style="width:100%;margin-top:8px"
onclick="go('profile')">
View Profile
</button>`;

practiceQuestions=[];
}

function editProfile(){

const name=prompt("Display name:",data.name);

if(name!==null&&name.trim())
data.name=name.trim().slice(0,40);

const level=prompt(
"Academic level:\n\n"+LEVELS.join("\n"),
data.level
);

if(level!==null&&level.trim())
data.level=level.trim().slice(0,40);

save();
renderProfile();
}

function showBookmarks(){

alert(
data.bookmarks.length?
"Saved Lessons:\n\n"+data.bookmarks.join("\n"):
"No bookmarks yet."
);
}

function showActivity(){

if(!data.activity.length){
alert("No recent activity.");
return;
}

alert(
"Recent Activity\n\n"+
data.activity.slice(0,15)
.map((x,i)=>`${i+1}. ${x.type}: ${x.title}`)
.join("\n")
);
}

function resetData(){

if(!confirm(
"Reset all ElectroBrain progress stored on this device?"
))return;

localStorage.removeItem(KEY);

data={
name:"Engineer",
level:"SHS / TVET",
xp:0,
correct:0,
attempts:0,
practice:0,
labs:0,
calculations:0,
learned:[],
bookmarks:[],
activity:[],
streak:0
};

renderProfile();
}
