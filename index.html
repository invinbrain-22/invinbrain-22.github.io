<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="ElectroBrain — Learn, Calculate, Experiment.">
<title>ElectroBrain ⚡</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#050b14;--panel:#07111e;--card:#0c1828;--card2:#102033;
--border:#1d3149;--border2:#29405b;--text:#f4f8ff;--muted:#9db0c8;
--blue:#37a8ff;--yellow:#ffd43b;--green:#45d483;--red:#ff6978
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.top{
height:64px;position:fixed;top:0;left:0;right:0;z-index:100;
display:flex;align-items:center;justify-content:center;
background:var(--panel);border-bottom:1px solid var(--border)
}
.logo{font-size:20px;font-weight:900}.logo span{color:var(--blue)}.logo b{color:var(--yellow)}
.page{position:fixed;top:64px;bottom:64px;left:0;right:0;display:none;background:var(--bg)}
.page.active{display:block}
.scroll{height:100%;overflow:auto;padding:20px 14px 100px;max-width:1000px;margin:auto}
nav{
position:fixed;bottom:0;left:0;right:0;height:64px;z-index:100;
display:grid;grid-template-columns:repeat(5,1fr);
background:var(--panel);border-top:1px solid var(--border)
}
nav button{border:0;background:none;color:var(--muted);font-size:10px}
nav button.active{color:var(--blue)}
.navicon{display:block;font-size:19px;margin-bottom:3px}
h1{font-size:28px;margin:5px 0 7px}
h2{font-size:19px;margin-bottom:7px}
h3{font-size:16px}
p{color:var(--muted);font-size:13px;line-height:1.5}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--blue);font-weight:900}
.card{
background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{
border:0;border-radius:12px;padding:12px;background:var(--blue);
color:#04101d;font-weight:900
}
.btn2{
border:1px solid var(--border2);border-radius:12px;padding:11px;
background:var(--panel);color:var(--text);font-weight:800
}
.search{
width:100%;padding:13px;border:1px solid var(--border2);
border-radius:12px;background:var(--panel);color:var(--text);outline:none
}
.tabs{
display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
background:var(--panel);border:1px solid var(--border);
padding:5px;border-radius:14px;margin:14px 0
}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs button{
border:0;background:transparent;color:var(--muted);
padding:11px;border-radius:10px;font-weight:900
}
.tabs button.active{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--blue)}
.topic{
padding:15px;border:1px solid var(--border);border-radius:15px;
background:var(--card);cursor:pointer
}
.topic:hover{border-color:var(--blue)}
.topic .ico{font-size:23px;margin-bottom:9px}
.topic small{display:block;color:#8295ad;margin-top:5px;font-size:11px}
.back{
border:0;background:none;color:var(--blue);font-weight:800;
padding:8px 0;margin-bottom:8px
}
.hide{display:none!important}
.notice{
padding:12px;border-radius:12px;background:#07111e;
border:1px solid var(--border);color:var(--muted);
font-size:12px;line-height:1.5;margin:12px 0
}
.result{
padding:17px;border-radius:16px;background:#071a18;
border:1px solid #246149;margin-top:12px
}
.result strong{color:var(--green);font-size:24px}
.formrow{margin:10px 0}
.formrow label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.formrow input,.formrow select{
width:100%;padding:12px;border:1px solid var(--border2);
border-radius:10px;background:var(--panel);color:var(--text)
}
.lesson{
background:var(--card);border:1px solid var(--border);
border-radius:18px;padding:18px;line-height:1.6
}
.lesson .diagram{
margin:15px 0;padding:25px;text-align:center;
border:1px dashed var(--border2);border-radius:14px;
font-size:38px;background:#07111e
}
.lesson .formula{
margin:14px 0;padding:15px;text-align:center;
background:#07111e;border-radius:12px;color:var(--yellow);
font-size:20px;font-weight:900
}
.lesson h3{margin-top:18px;margin-bottom:7px;color:var(--blue)}
.lesson ul{padding-left:20px;color:var(--muted);font-size:13px}
.lesson li{margin:5px 0}
.lesson .answerbox{
padding:13px;background:#07111e;border-radius:12px;margin-top:10px
}
.lessonnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.lessonnav button{padding:12px;border-radius:11px;border:1px solid var(--border2);background:var(--panel);color:var(--text)}
.quiz{
padding:18px;background:var(--card);border:1px solid var(--border);border-radius:17px
}
.qmeta{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:1px}
.question{font-size:19px;line-height:1.4;margin:13px 0}
.answers{display:grid;gap:9px}
.answer{
text-align:left;width:100%;padding:13px;border-radius:11px;
border:1px solid var(--border2);background:var(--panel);color:var(--text)
}
.answer.correct{border-color:var(--green)}
.answer.wrong{border-color:var(--red)}
.feedback{padding:13px;margin-top:13px;background:#07111e;border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
.profilehero{
display:flex;align-items:center;gap:13px;padding:18px;
background:linear-gradient(135deg,#0c1828,#07111e);
border:1px solid var(--border);border-radius:20px
}
.avatar{
width:58px;height:58px;display:grid;place-items:center;
border-radius:16px;background:#102a43;border:1px solid var(--blue);
font-size:27px;color:var(--yellow)
}
.profilehero>div:nth-child(2){flex:1}
.iconbtn{
border:1px solid var(--border2);background:var(--panel);
color:var(--text);padding:9px;border-radius:10px
}
.metric{
padding:14px;text-align:center;background:var(--card);
border:1px solid var(--border);border-radius:15px
}
.metric b{display:block;font-size:20px;color:var(--blue)}
.metric span{font-size:10px;color:var(--muted)}
.progress{
height:8px;background:#07111e;border-radius:99px;overflow:hidden
}
.progress i{display:block;height:100%;width:0;background:var(--blue)}
.badge{
padding:14px;background:var(--card);border:1px solid var(--border);border-radius:15px
}
.badge small{display:block;color:var(--muted);margin-top:5px}
.menu{overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:16px}
.menu button{
width:100%;display:flex;gap:12px;align-items:center;
padding:14px;border:0;border-bottom:1px solid var(--border);
background:none;color:var(--text);text-align:left
}
.menu button:last-child{border:0}.menu span{flex:1}.menu small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.labtop{
display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px
}
.labvisual{
height:130px;border:1px dashed var(--border2);border-radius:15px;
display:grid;place-items:center;background:#07111e;font-size:54px;margin:12px 0
}
.labsteps{display:grid;gap:8px;margin:12px 0}
.step{
padding:12px;border:1px solid var(--border);background:#07111e;border-radius:11px
}
.step b{color:var(--blue);margin-right:7px}
.workbench{
padding:15px;background:#06101b;border:1px solid var(--border);
border-radius:17px;margin-top:12px
}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.part{
padding:13px;text-align:center;background:var(--card);
border:1px solid var(--border);border-radius:12px;cursor:pointer
}
.part.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.wire{
height:4px;background:var(--yellow);margin:9px 0;border-radius:5px
}
@media(max-width:600px){
.grid4{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.parts{grid-template-columns:repeat(2,1fr)}
.scroll{padding-left:12px;padding-right:12px}
}
</style>
</head>

<body>

<header class="top">
<div class="logo">Electro<span>Brain</span> <b>⚡</b></div>
</header>

<!-- =====================================================
     HOME / LEARN
     ===================================================== -->

<main id="home" class="page active">
<section class="scroll" id="learnPage"></section>
</main>

<!-- =====================================================
     CALCULATIONS
     ===================================================== -->

<main id="calc" class="page">
<section class="scroll" id="calcPage"></section>
</main>

<!-- =====================================================
     LABS
     ===================================================== -->

<main id="labs" class="page">
<section class="scroll" id="labsPage"></section>
</main>

<!-- =====================================================
     PRACTICE
     ===================================================== -->

<main id="practice" class="page">
<section class="scroll" id="practicePage"></section>
</main>

<!-- =====================================================
     PROFILE
     ===================================================== -->

<main id="profile" class="page">
<section class="scroll" id="profilePage"></section>
</main>

<nav>
<button class="active" onclick="go('home',this)">
<span class="navicon">⌂</span>Home
</button>
<button onclick="go('calc',this)">
<span class="navicon">⚡</span>Calculations
</button>
<button onclick="go('labs',this)">
<span class="navicon">⚙</span>Labs
</button>
<button onclick="go('practice',this)">
<span class="navicon">✓</span>Practice
</button>
<button onclick="go('profile',this)">
<span class="navicon">●</span>Profile
</button>
</nav>

<script>

/* =====================================================
   DATA
   ===================================================== */

const LEVELS=[
"SHS / TVET",
"University 100",
"University 200",
"University 300",
"University 400"
];

const SUBJECTS={
"SHS / TVET":[
"Electrical Fundamentals","DC Circuits","AC Circuits",
"Electrical Installation & Protection","Measurement & Instrumentation",
"Electrical Machines","Transformers","Electronics",
"Digital Electronics","Technical Drawing","Renewable Energy",
"Engineering Mathematics","Basic Control Systems",
"Industrial Electricity","Electrical Calculations","Basic Electronics"
],
"University 100":[
"Engineering Mathematics I","Engineering Physics",
"Electrical Engineering Fundamentals","Circuit Theory I",
"Digital Logic Fundamentals","Engineering Drawing",
"Measurement Fundamentals","Computing for Engineers",
"Programming for Electrical Engineers","Electrical Workshop Practice",
"Introduction to Control Systems","Introduction to Power Systems",
"Engineering Materials"
],
"University 200":[
"Engineering Mathematics II","Circuit Theory II","AC Circuit Analysis",
"Electronics I","Electrical Machines I","Signals & Systems",
"Electromagnetics I","Measurements & Instrumentation",
"Power Systems Fundamentals","Control Systems I",
"Electromagnetic Fields","Electrical Installation Engineering",
"Electronic Devices","Engineering Probability & Statistics",
"Electrical Energy Systems"
],
"University 300":[
"Power Electronics","Electrical Machines II","Power Systems",
"Protection Systems","Control Systems II","PLC & Industrial Automation",
"Renewable Energy Systems","Electrical Drives","Advanced Electronics",
"Transmission & Distribution","Electromagnetics II",
"Power System Protection","Industrial Instrumentation",
"Embedded Systems","Engineering Economics"
],
"University 400":[
"Advanced Power Systems","High Voltage Engineering",
"Advanced Protection","Advanced Control","Power Electronics Applications",
"Renewable & Solar PV Systems","Electrical Drives",
"Industrial Automation","Engineering Project","Research Methods",
"Professional Practice","Smart Grids","Power System Stability",
"Advanced Instrumentation","Engineering Design",
"Entrepreneurship for Engineers"
]
};

/* Every subject receives chapters/topics. */
const CHAPTERS=[
"Introduction & Fundamentals",
"Principles & Components",
"Analysis & Calculations",
"Applications & Troubleshooting"
];

const SPECIAL={
"Voltage":["Definition & Potential Difference","Sources of Voltage","Measurement of Voltage","Applications"],
"Current":["Electric Current","Conventional Current","Current Measurement","Applications"],
"Resistance":["Resistance Concept","Resistors","Resistance Measurement","Applications"],
"Power":["Electrical Power","Power Equations","Power Measurement","Applications"],
"Ohm's Law":["Law & Relationship","Voltage Calculations","Current Calculations","Resistance Calculations"],
"Transformers":["Construction","Operating Principle","Transformer Ratio","Applications"],
"Induction Motors":["Construction","Operating Principle","Motor Slip","Applications"],
"PLC Fundamentals":["PLC Architecture","Inputs & Outputs","Programming Concepts","Applications"],
"Variable Frequency Drives":["VFD Components","Frequency Control","Motor Control","Applications"],
"Solar PV Systems":["PV Components","PV Connections","System Design","Applications"],
"Battery Storage":["Battery Types","Capacity","Charging","Applications"]
};

function makeTopics(subject){
let arr=[];
let special=SPECIAL[subject];
for(let i=0;i<4;i++){
let base=special?special[i]:CHAPTERS[i];
arr.push({
chapter:"Chapter "+(i+1),
topic:base,
subs:[
"Introduction",
"Principles & Operation",
"Calculations & Examples",
"Applications & Key Notes"
]
});
}
return arr;
}

const CURRICULUM={};
Object.keys(SUBJECTS).forEach(level=>{
CURRICULUM[level]=SUBJECTS[level].map(subject=>({
subject,
chapters:makeTopics(subject)
}));
});

/* =====================================================
   APP STATE
   ===================================================== */

const KEY="electrobrainData";

let data={
name:"Engineer",
level:"SHS / TVET",
xp:0,
correct:0,
attempts:0,
practice:0,
labs:0,
calculations:0,
learned:[],
bookmarks:[],
activity:[],
streak:0
};

try{
let saved=JSON.parse(localStorage.getItem(KEY));
if(saved)data={...data,...saved};
}catch(e){}

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function activity(type,title){
data.activity.unshift({
type,title,time:Date.now()
});
data.activity=data.activity.slice(0,30);
save();
}

function esc(x){
return String(x)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function go(id,btn){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

if(btn)btn.classList.add("active");

if(id==="home")renderLearn();
if(id==="calc")renderCalc();
if(id==="labs")renderLabs();
if(id==="practice")renderPractice();
if(id==="profile")renderProfile();
}


/* =====================================================
   LEARN
   ===================================================== */

let learnState={
level:null,
subject:null,
chapter:null,
topic:null,
sub:null
};

function renderLearn(){

const p=document.getElementById("learnPage");

if(!learnState.level){

p.innerHTML=`
<div class="eyebrow">UNDERSTAND • LEARN</div>
<h1>ElectroBrain Learn</h1>
<p>Digital electrical engineering textbook for SHS, TVET and University 100–400.</p>

<div class="card" style="margin-top:15px">
<h2>Select Academic Level</h2>
<div class="grid" style="margin-top:12px">
${LEVELS.map(x=>`
<div class="topic" onclick="selectLearnLevel('${esc(x)}')">
<div class="ico">📘</div>
<b>${esc(x)}</b>
<small>${SUBJECTS[x].length} subjects</small>
</div>`).join("")}
</div>
</div>`;
return;
}

if(learnState.subject===null){

let subjects=CURRICULUM[learnState.level];

p.innerHTML=`
<button class="back" onclick="learnState.level=null;renderLearn()">← Levels</button>
<div class="eyebrow">${esc(learnState.level)}</div>
<h1>Select Subject</h1>
<p>Choose an engineering subject.</p>

<div class="grid" style="margin-top:15px">
${subjects.map((x,i)=>`
<div class="topic" onclick="selectLearnSubject(${i})">
<div class="ico">⚡</div>
<b>${esc(x.subject)}</b>
<small>4 chapters • 16 learning sections</small>
</div>`).join("")}
</div>`;
return;
}

if(learnState.chapter===null){

let s=CURRICULUM[learnState.level][learnState.subject];

p.innerHTML=`
<button class="back" onclick="learnState.subject=null;renderLearn()">← Subjects</button>
<div class="eyebrow">${esc(learnState.level)}</div>
<h1>${esc(s.subject)}</h1>
<p>Select a chapter.</p>

<div class="grid" style="margin-top:15px">
${s.chapters.map((x,i)=>`
<div class="topic" onclick="selectLearnChapter(${i})">
<div class="ico">📚</div>
<b>${esc(x.chapter)}</b>
<small>${esc(x.topic)}</small>
</div>`).join("")}
</div>`;
return;
}

if(learnState.topic===null){

let s=CURRICULUM[learnState.level][learnState.subject];
let c=s.chapters[learnState.chapter];

p.innerHTML=`
<button class="back" onclick="learnState.chapter=null;renderLearn()">← Chapters</button>
<div class="eyebrow">${esc(c.chapter)}</div>
<h1>${esc(c.topic)}</h1>
<p>Select a sub-topic.</p>

<div class="grid" style="margin-top:15px">
${c.subs.map((x,i)=>`
<div class="topic" onclick="openLesson(${i})">
<div class="ico">⚙</div>
<b>${esc(x)}</b>
<small>Textbook lesson</small>
</div>`).join("")}
</div>`;
return;
}

}

/* Learn selection */

function selectLearnLevel(x){
learnState={level:x,subject:null,chapter:null,topic:null,sub:null};
renderLearn();
}

function selectLearnSubject(i){
learnState.subject=i;
learnState.chapter=null;
learnState.topic=null;
renderLearn();
}

function selectLearnChapter(i){
learnState.chapter=i;
learnState.topic=null;
renderLearn();
}


/* =====================================================
   TEXTBOOK LESSON
   ===================================================== */

function openLesson(sub){

let s=CURRICULUM[learnState.level][learnState.subject];
let c=s.chapters[learnState.chapter];

learnState.topic=c.topic;
learnState.sub=sub;

let title=c.subs[sub];

let special={
"Voltage":["Voltage is the electrical potential difference between two points.","V = W / Q","V = voltage, W = energy/work, Q = charge."],
"Current":["Electric current is the rate at which electric charge flows.","I = Q / t","I = current, Q = charge, t = time."],
"Resistance":["Resistance is the opposition offered to electric current.","R = V / I","R = resistance, V = voltage, I = current."],
"Power":["Electrical power is the rate at which electrical energy is transferred.","P = VI","P = power, V = voltage, I = current."],
"Ohm's Law":["Ohm's Law relates voltage, current and resistance.","V = IR","V = voltage, I = current, R = resistance."],
"Transformers":["A transformer transfers electrical energy between circuits through electromagnetic induction.","Vp / Vs = Np / Ns","V = voltage, N = number of turns."],
"Induction Motors":["An induction motor converts electrical energy into mechanical energy using electromagnetic principles.","Ns = 120f / P","Ns = synchronous speed, f = frequency, P = poles."],
"PLC Fundamentals":["A PLC is a programmable controller used to automate industrial processes.","Input → PLC → Output","Inputs provide signals; the controller processes logic; outputs operate field devices."],
"Variable Frequency Drives":["A VFD controls an AC motor by varying supply frequency and related voltage.","Ns = 120f / P","Changing frequency changes motor operating speed."],
"Solar PV Systems":["Photovoltaic systems convert sunlight into electrical energy.","P = VI","PV modules produce DC electrical power." ]
};

let key=Object.keys(special).find(x=>c.topic.includes(x))||"";
let info=special[key]||[
c.topic+" is an important electrical engineering subject area.",
"Engineering analysis depends on the exact circuit, equipment and operating conditions.",
"Always verify practical and safety-critical work using approved engineering documentation."
];

let learnedId=learnState.level+"|"+s.subject+"|"+c.chapter+"|"+title;

if(!data.learned.includes(learnedId)){
data.learned.push(learnedId);
data.xp+=15;
activity("Learn",title);
}

save();

document.getElementById("learnPage").innerHTML=`

<button class="back" onclick="learnState.topic=null;renderLearn()">← Sub-topics</button>

<div class="eyebrow">${esc(c.chapter)}</div>
<h1>${esc(title)}</h1>

<div class="lesson">

<div class="diagram">
${key==="Transformers"?"⚡ ⇄ ⚡":
 key==="Induction Motors"?"⚙️":
 key==="PLC Fundamentals"?"🎛️ → 🧠 → ⚙️":
 key==="Solar PV Systems"?"☀️ → 🔋 → ⚡":
 key==="Voltage"?"＋ ─── ○ ─── −":
 "⚡"}
</div>

<h3>Definition</h3>
<p>${esc(info[0])}</p>

<h3>Explanation</h3>
<p>
${esc(title)} forms part of the structured ElectroBrain
engineering curriculum. Study the principle, understand the
physical components, then apply the concept through calculation,
laboratory simulation and practice.
</p>

<h3>Important Points</h3>
<ul>
<li>Understand the physical meaning of the quantities involved.</li>
<li>Identify the correct units and symbols.</li>
<li>Use the correct engineering formula.</li>
<li>Check whether the final answer is reasonable.</li>
</ul>

<h3>Formula</h3>
<div class="formula">${esc(info[1])}</div>

<h3>Symbol Meanings</h3>
<div class="answerbox">${esc(info[2])}</div>

<h3>Worked Example</h3>
<div class="answerbox">
<b>Given:</b><br>
Voltage = 12 V<br>
Resistance = 4 Ω<br><br>

<b>Solution:</b><br>
I = V / R<br>
I = 12 / 4<br>
I = 3 A<br><br>

<strong style="color:var(--green)">Answer: 3 A</strong>
</div>

<h3>Key Note</h3>
<p>
The formula is only one part of engineering understanding.
Always identify the physical system and operating conditions
before applying a calculation.
</p>

<h3>Quick Check</h3>
<div class="answerbox">
What should you identify before applying an engineering formula?
<br><br>
<b>Answer:</b> The known quantities, required quantity,
units and applicable relationship.
</div>

<div class="notice">
Educational simulation only. Safety-critical electrical work
must be performed under appropriate supervision and according
to applicable engineering standards and procedures.
</div>

<div class="lessonnav">
<button onclick="learnState.topic=null;renderLearn()">← Back</button>
<button onclick="openRelatedCalc('${esc(c.topic)}')">Calculator →</button>
</div>

</div>`;
}

function openRelatedCalc(title){
go("calc");
calcState.topic=null;
calcState.sub=null;
renderCalc();
}


/* =====================================================
   CALCULATIONS
   ===================================================== */

const CALCS=[
["Ohm's Law","V = IR","V","I","R"],
["Electrical Power","P = VI","P","V","I"],
["Electrical Energy","E = Pt","E","P","t"],
["DC Circuits","V = IR","V","I","R"],
["AC Circuits","Z = √(R² + X²)","Z","R","X"],
["Resistors","Rtotal = R1 + R2","R","R1","R2"],
["Capacitors","Ctotal = C1 + C2","C","C1","C2"],
["Inductors","Ltotal = L1 + L2","L","L1","L2"],
["Impedance","Z = V / I","Z","V","I"],
["Power Factor","PF = P / S","PF","P","S"],
["Single-Phase Systems","P = VIcosφ","P","V","I"],

function calcFields(c){

let labels={
"V":"Voltage (V)","I":"Current (A)","R":"Resistance (Ω)",
"P":"Power (W)","t":"Time (h)","X":"Reactance (Ω)",
"Z":"Impedance (Ω)","S":"Apparent Power (VA)",
"C":"Capacitance (F)","L":"Inductance (H)",
"f":"Frequency (Hz)","P":"Power / Poles","Vd":"Voltage Drop (V)",
"Ah":"Battery Capacity (Ah)","kWh":"Energy (kWh)","Rate":"Rate"
};

if(c[0]==="Ohm's Law")
return input("v","Voltage (V)")+
input("r","Resistance (Ω)");

if(c[0]==="Electrical Power")
return input("v","Voltage (V)")+
input("i","Current (A)");

if(c[0]==="Electrical Energy")
return input("p","Power (W)")+
input("t","Time (h)");

if(c[0]==="AC Circuits")
return input("r","Resistance (Ω)")+
input("x","Reactance (Ω)");

if(c[0]==="Impedance")
return input("v","Voltage (V)")+
input("i","Current (A)");

if(c[0]==="Power Factor")
return input("p","Real Power (W)")+
input("s","Apparent Power (VA)");

if(c[0]==="Single-Phase Systems"||
c[0]==="Three-Phase Systems")
return input("v","Voltage (V)")+
input("i","Current (A)")+
input("pf","Power Factor");

if(c[0]==="AC Motors")
return input("f","Frequency (Hz)")+
input("poles","Number of Poles");

if(c[0]==="Cable & Wire Sizing"||
c[0]==="Fuses & Circuit Breakers")
return input("p","Power (W)")+
input("v","Voltage (V)");

if(c[0]==="Voltage Drop")
return input("i","Current (A)")+
input("r","Resistance (Ω)");

if(c[0]==="Batteries")
return input("v","Voltage (V)")+
input("ah","Capacity (Ah)");

if(c[0]==="Solar PV Systems")
return input("v","Voltage (V)")+
input("i","Current (A)");

if(c[0]==="Electricity Consumption & Cost")
return input("kwh","Energy (kWh)")+
input("rate","Rate per kWh");

return input("value","Value")+
input("factor","Conversion Factor");
}

function input(id,label){
return `<div class="formrow">
<label>${label}</label>
<input id="${id}" type="number" step="any" placeholder="Enter value">
</div>`;
}

function num(id){
return parseFloat(document.getElementById(id)?.value)||0;
}

function doCalc(){

let c=CALCS[calcState.topic];
let result=0;
let unit="";

switch(c[0]){

case"Ohm's Law":
result=num("v")/num("r");unit="A";break;

case"Electrical Power":
result=num("v")*num("i");unit="W";break;

case"Electrical Energy":
result=num("p")*num("t");unit="Wh";break;

case"AC Circuits":
result=Math.sqrt(num("r")**2+num("x")**2);unit="Ω";break;

case"Impedance":
result=num("v")/num("i");unit="Ω";break;

case"Power Factor":
result=num("p")/num("s");unit="";break;

case"Single-Phase Systems":
result=num("v")*num("i")*num("pf");unit="W";break;

case"Three-Phase Systems":
result=Math.sqrt(3)*num("v")*num("i")*num("pf");unit="W";break;

case"AC Motors":
result=120*num("f")/num("poles");unit="rpm";break;

case"Cable & Wire Sizing":
case"Fuses & Circuit Breakers":
result=num("p")/num("v");unit="A";break;

case"Voltage Drop":
result=num("i")*num("r");unit="V";break;

case"Batteries":
result=num("v")*num("ah");unit="Wh";break;

case"Solar PV Systems":
result=num("v")*num("i");unit="W";break;

case"Electricity Consumption & Cost":
result=num("kwh")*num("rate");unit="";break;

default:
result=num("value")*num("factor");unit="";
}

if(!isFinite(result)){
alert("Enter valid values.");
return;
}

data.calculations++;
data.xp+=5;
activity("Calculation",c[0]);
save();

document.getElementById("calcResult").innerHTML=`
<div class="result">
<div>FINAL ANSWER</div>
<strong>${result.toFixed(3).replace(/\.?0+$/,"")} ${unit}</strong>
<p style="margin-top:8px">Formula used: ${esc(c[1])}</p>
<p style="margin-top:7px">
The result is calculated from the values entered above.
</p>
</div>`;
}

data.bookmarks.length?
"Bookmarks:\n\n"+data.bookmarks.join("\n"):
"No bookmarks yet."
);
}

function showActivity(){

if(!data.activity.length){
alert("No recent activity.");
return;
}

alert(
"Recent Activity\n\n"+
data.activity.slice(0,12)
.map((x,i)=>
`${i+1}. ${x.type}: ${x.title}`)
.join("\n")
);
}

function resetData(){

if(!confirm(
"Reset all ElectroBrain progress stored on this device?"
))return;

localStorage.removeItem(KEY);

data={
name:"Engineer",
level:"SHS / TVET",
xp:0,
correct:0,
attempts:0,
practice:0,
labs:0,
calculations:0,
learned:[],
bookmarks:[],
activity:[],
streak:0
};

renderProfile();
}
